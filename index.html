<style>
/* Layout: dunkles Terminal, eine kompakte Spalte, Tonstufen statt Schatten, Tab-Leiste unten */
:root{
  --void:#080809; --obsidian:#141415; --charcoal:#1b1d1f; --graphite:#26272d; --slate:#3c3d40; --iron:#34353c;
  --fog:#acadae; --paper:#ffffff; --ice:#83c3ff; --neg:#e24756;
  --ice-08:rgba(131,195,255,.08); --ice-20:rgba(131,195,255,.2); --neg-15:rgba(226,71,86,.16); --ring:inset 0 0 0 1px rgba(255,255,255,.08);
  --f-ui:Inter,"Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-sm:4px; --r-lg:8px; --hover:rgba(60,61,64,.5); color-scheme:dark;
}
/* Helles Design: gleiche Rollen, eigene Stufen (Hintergrund hell, Text dunkel, Akzent dunkleres Blau für Kontrast).
   data-theme="light" = immer hell, "system" = hell, wenn das Handy hell eingestellt ist. */
:root[data-theme="light"]{
  --void:#f3f4f6; --obsidian:#ffffff; --charcoal:#ffffff; --graphite:#eceef1; --slate:#dde0e5; --iron:#d3d6dc;
  --fog:#5b6068; --paper:#14161a; --ice:#1a6bc0; --neg:#c42b3b;
  --ice-08:rgba(26,107,192,.08); --ice-20:rgba(26,107,192,.16); --neg-15:rgba(196,43,59,.12); --ring:inset 0 0 0 1px rgba(0,0,0,.09);
  --hover:rgba(0,0,0,.04); color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="system"]{
    --void:#f3f4f6; --obsidian:#ffffff; --charcoal:#ffffff; --graphite:#eceef1; --slate:#dde0e5; --iron:#d3d6dc;
    --fog:#5b6068; --paper:#14161a; --ice:#1a6bc0; --neg:#c42b3b;
    --ice-08:rgba(26,107,192,.08); --ice-20:rgba(26,107,192,.16); --neg-15:rgba(196,43,59,.12); --ring:inset 0 0 0 1px rgba(0,0,0,.09);
    --hover:rgba(0,0,0,.04); color-scheme:light;
  }
}
.menu{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 54px);right:max(16px,env(safe-area-inset-right,0px));min-width:240px;background:var(--charcoal);box-shadow:var(--ring),0 8px 24px rgba(0,0,0,.25);border-radius:var(--r-lg);display:flex;flex-direction:column;overflow:hidden}
.menu button{border:0;background:none;text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-weight:500;border-bottom:1px solid var(--iron)}
.menu button:last-child{border-bottom:0}
.menu button:hover{background:var(--hover)}
.menu button span{font-size:12px;font-weight:400;color:var(--fog)}
section.sep{border-top:1px solid var(--iron);padding-top:20px}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--void)}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--obsidian)}
html,body{overscroll-behavior-y:contain}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--obsidian);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ice);display:inline-block}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--fog);margin-left:auto;text-align:right;line-height:1.25}
.ibtn{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--iron);background:transparent;display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px;fill:none;stroke:var(--paper);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;line-height:1.25}
h2{font-size:24px;letter-spacing:-.01em}
h3{font-size:12px;font-weight:500;color:var(--fog);text-transform:uppercase;letter-spacing:.08em}
main{display:flex;flex-direction:column;gap:32px;padding-block:16px 32px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--fog)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
details.extra>summary{cursor:pointer;color:var(--fog);font-size:14px;padding:4px 0 8px;list-style:none}
details.extra>summary::-webkit-details-marker{display:none}
details.extra>summary::before{content:'▸ ';color:var(--ice)}
details.extra[open]>summary::before{content:'▾ '}
details.extra>*+*{margin-top:10px}
.xp{display:inline-flex}.xp .chip:first-child{border-top-right-radius:0;border-bottom-right-radius:0}
.xp .chip.x{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-1px;color:var(--fog);padding-inline:10px}
.chip{height:30px;border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--ice);background:var(--ice-08);color:var(--paper)}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:500;white-space:nowrap;color:var(--fog)}
.seg button.on{border-color:var(--ice);color:var(--paper);background:var(--ice-08)}
.btn{border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:10px 16px;font-weight:500;font-size:14px}
.btn.primary{border-color:var(--ice)}
.btn.primary:hover{border-color:var(--paper)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.block{width:100%}
.btn.big{padding:14px 16px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.li.mu{flex-direction:column;align-items:stretch;gap:6px}
.mu-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:start}
.mu-row:has(> :only-child){grid-template-columns:1fr}
.mu-p{display:flex;flex-direction:column;gap:2px;min-width:0}
.mu-p.r{text-align:right}
.mu-vs{font-family:var(--f-mono);font-size:12px;color:var(--fog);padding-top:2px}
.mu-h{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--fog)}
.mu-h span:last-child{text-align:right}
.pvar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pvar .btn{display:flex;flex-direction:column;align-items:center;gap:2px;padding-inline:6px}
.pvar .btn span{font-size:12px;font-weight:400;color:var(--fog)}
.gset{display:flex;flex-direction:column;gap:8px}
.gspec{display:flex;flex-direction:column;gap:2px;min-width:0}
.gspec b{font-weight:500;color:var(--paper)}
.gspec span{font-size:12px;color:var(--fog)}
.gset.main{box-shadow:inset 0 0 0 1px var(--ice)}
.ggrp{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid var(--iron)}
.ggh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:500}
.gcard{display:flex;flex-direction:column;gap:8px}
.gcard.main{box-shadow:inset 0 0 0 1px var(--ice)}
.gstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 4px}
.gstat div{display:flex;flex-direction:column;min-width:0}
.gstat b{font-family:var(--f-mono);font-weight:500;font-size:15px;color:var(--paper)}
.gstat span{font-size:11px;color:var(--fog);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gsel select{width:100%}
textarea{width:100%;border:1px solid var(--iron);background:var(--charcoal);border-radius:var(--r-sm);padding:10px 12px;font:inherit;color:inherit;resize:vertical}
.ilist{display:flex;flex-direction:column;gap:8px}
.idea p{margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.idea.done p{color:var(--fog);text-decoration:line-through}
input[type=text],input[type=password],select{height:40px;border:1px solid var(--iron);background:var(--charcoal);border-radius:var(--r-sm);padding:0 12px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--fog)}
.chip.danger{border-color:var(--neg);color:var(--neg)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fog)}
.link{border:0;background:none;color:var(--ice);font-weight:500;padding:0;align-self:flex-start;font-size:14px}
.tbl{overflow-x:auto;border-radius:var(--r-lg);background:var(--charcoal);box-shadow:var(--ring)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--iron)}
th{font-size:12px;color:var(--fog);font-weight:500}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td.c,th.c{text-align:center} th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--ice-08)}
tr.me td:first-child{box-shadow:inset 2px 0 0 var(--ice)}
tr.tap{cursor:pointer}
tr.tap:hover td{background:var(--hover)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-mono);font-size:20px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--fog)}
.pill{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--f-mono)}
.pill.w{background:var(--ice-20);color:var(--ice)} .pill.l{background:var(--neg-15);color:var(--neg)} .pill.d{background:var(--graphite);color:var(--fog)}
.list{display:flex;flex-direction:column;background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:48px;border:0;border-bottom:1px solid var(--iron);background:none;width:100%;text-align:left;min-width:0}
.li:last-child{border-bottom:0}
button.li:hover{background:var(--hover)}
.li.sel{box-shadow:inset 2px 0 0 var(--ice);background:var(--ice-08)}
.li .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .two{white-space:normal;padding-block:8px}
.score{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.next{background:var(--graphite);box-shadow:var(--ring);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:4px}
.next .vs{font-size:20px;font-weight:500;line-height:1.25}
.cap{font-family:var(--f-mono);font-size:12px;color:var(--fog)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--iron);stroke-width:1}
.chart .ax{fill:var(--fog);font-size:12px;font-family:var(--f-mono)}
.chart .ln{fill:none;stroke:var(--ice);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--ice);opacity:.1}
.chart .pt{fill:var(--ice)} .chart .end{fill:var(--void);stroke:var(--ice);stroke-width:2.5}
.chart .goal{stroke:var(--fog);stroke-width:1;stroke-dasharray:4 4}
.chart .vl{fill:var(--fog);font-size:12px;font-family:var(--f-mono)}
.radar{max-width:480px;margin:0 auto;display:block}
.radar .ax{font-family:var(--f-ui);font-size:13px}
.radar .rval{fill:var(--paper);font-family:var(--f-mono)}
.radar .ar{opacity:.14}
.radar .rprev{fill:none;stroke:var(--fog);stroke-width:1.5;stroke-dasharray:3 3}
.radar .pt{stroke:var(--charcoal);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;color:var(--fog);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--ice)}
.legend .lg-prev{border-top:1.5px dashed var(--fog)}
.legend .lg-goal{border-top:1px dashed var(--fog)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rgrid .card{display:flex;flex-direction:column;gap:4px;font-size:13px}
.good{color:var(--ice)}
.chart .lbl{fill:var(--paper);font-size:13px;font-weight:500;font-family:var(--f-mono)}
.heat td.v{font-family:var(--f-mono);text-align:center;font-size:13px}
.h1{background:var(--neg-15)}.h2{background:var(--ice-08)}.h3{background:var(--ice-20);color:var(--paper)}
/* Scoreboard */
.board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.pl{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pl.act{box-shadow:inset 0 0 0 1px var(--ice);background:var(--graphite)}
.pl .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .rem{font-family:var(--f-mono);font-weight:500;font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pl .sub{font-size:12px;color:var(--fog);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono)}
.pl .nmr{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.pl .lg{font-family:var(--f-mono);font-size:12px;color:var(--fog);white-space:nowrap}
.pl .st{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ice);margin-right:6px;vertical-align:middle}
.pl .avgs{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.pl .avgs em{display:block;font-style:normal;font-size:11px;color:var(--fog)}
body.live header.top{display:none}
body.live main{padding-top:10px}
body.live #app>section{gap:8px}
body.live .pl .rem{font-size:44px}
body.live .entry{font-size:32px;min-height:46px;padding:2px}
body.live .quick button{height:34px}
body.live .pad button{height:46px}
body.live .pad .mods button{height:38px}
body.live .cohint{padding:6px 12px}
body.live .cohint b{font-size:19px}
body.live .btn{padding-block:8px}
.pl .remr{display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.pl .dc{font-family:var(--f-mono);font-size:18px;text-align:right;line-height:1.1;padding-bottom:4px}
.pl .dc em{display:block;font-style:normal;font-size:11px;color:var(--fog)}
.pl .co{font-family:var(--f-mono);font-size:13px;color:var(--ice);min-height:20px}
.cohint{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:var(--r-lg);background:var(--ice-08);box-shadow:inset 0 0 0 1px var(--ice)}
.cohint b{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--ice);letter-spacing:-.01em}
.darts{display:flex;gap:8px;min-height:34px}
.darts span{min-width:56px;text-align:center;border:1px dashed var(--iron);border-radius:var(--r-sm);padding:4px 6px;font-family:var(--f-mono);font-size:16px;font-weight:500}
.darts span.f{border-style:solid;background:var(--graphite)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{border:1px solid var(--iron);background:var(--charcoal);border-radius:var(--r-sm);height:52px;font-family:var(--f-mono);font-size:18px;font-weight:500}
.pad button:active{background:var(--slate)}
.pad .wide{grid-column:span 2}
.pad .mods{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad .mods button{font-family:var(--f-ui);font-size:15px;height:44px}
.pad .mods button.on{border-color:var(--paper);background:var(--slate)}
.pad .mods button.d.on{border-color:var(--ice);color:var(--ice);background:var(--ice-08)}
.pad .mods button.t.on{border-color:var(--neg);color:var(--neg);background:var(--neg-15)}
.pad .act{background:var(--graphite)}
.pad.np{grid-template-columns:repeat(3,1fr)}
.pad .ok{border-color:var(--ice);color:var(--ice)}
.entry{font-family:var(--f-mono);font-size:40px;font-weight:500;text-align:center;background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:4px;min-height:60px;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);height:36px;font-family:var(--f-mono);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbig{font-family:var(--f-mono);font-size:64px;font-weight:500;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.tbtns:has(> :nth-child(3):last-child){grid-template-columns:repeat(3,1fr)}
.tbtns:has(> :nth-child(4)){grid-template-columns:repeat(4,1fr)}
.tbtns button{min-height:76px;padding:8px 4px;font-size:16px;font-weight:500;border-radius:var(--r-sm);border:1px solid var(--iron);background:var(--charcoal);touch-action:manipulation;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
.tbtns button b{font-family:var(--f-mono);font-size:30px;font-weight:500;line-height:1}
.tbtns button span{font-size:11px;color:var(--fog);text-align:center}
.tbtns .hit span{color:inherit;opacity:.8}
.tfoot{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.tfoot .btn{width:100%}
.tfoot .link{align-self:center;padding:6px 0}
.link.warn{color:var(--neg)}
.tbtns .hit{border-color:var(--ice);color:var(--ice);background:var(--ice-08)}
.tbtns .miss{background:var(--graphite);color:var(--fog)}
.tbtns button:active,.quick button:active,.btn:active{background:var(--slate)}
/* Tipp-Feedback: Rand leuchtet kurz in Ice auf */
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--ice),0 0 14px rgba(131,195,255,.45)}100%{box-shadow:0 0 0 2px transparent,0 0 0 transparent}}
/* Nach unten ziehen zum Aktualisieren */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:7;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--graphite);box-shadow:var(--ring);display:grid;place-items:center;opacity:0;transform:translateY(-48px);pointer-events:none}
#ptr svg{width:18px;height:18px;fill:none;stroke:var(--fog);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.ready svg{stroke:var(--ice)}
#ptr.go{transition:transform .2s,opacity .2s}
#ptr.spin svg{animation:spin 1s linear infinite;stroke:var(--ice)}
.note{background:var(--graphite);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;font-size:14px}
.note.warn{box-shadow:inset 0 0 0 1px var(--neg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--obsidian);border-top:1px solid var(--iron);display:grid;grid-template-columns:repeat(4,1fr);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--fog);padding:8px 0;box-shadow:inset 0 2px 0 transparent}
nav.tabs button.on{color:var(--paper);box-shadow:inset 0 2px 0 var(--ice)}
nav.tabs button.on svg{stroke:var(--ice)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graphite);box-shadow:var(--ring);color:var(--paper);padding:10px 14px;border-radius:var(--r-lg);font-size:14px;z-index:20;max-width:90vw}
.set{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--iron)}
.set:last-child{border-bottom:0}
.set .h{min-width:0}.set .g{text-align:right;min-width:0}
.legs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.set .g .legs{justify-content:flex-end}
.legs i{font-style:normal;font-family:var(--f-mono);font-size:12px;padding:0 5px;border-radius:var(--r-sm);background:var(--graphite);color:var(--fog)}
.legs i.w{background:var(--ice-20);color:var(--ice)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Dirty Checkers</div>
    <div class="stamp" id="stamp"></div>
    <button class="ibtn" id="refreshBtn" data-act="refreshLiga" aria-label="Liga-Daten aktualisieren"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ibtn" data-act="menu" aria-label="Menü" aria-haspopup="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div id="menu" class="menu" role="menu" hidden><button role="menuitem" data-act="tab" data-t="setup">Dart-Setup<span>Sets und Teile</span></button><button role="menuitem" data-act="tab" data-t="ideas">Ideen<span>Einfälle für die App sammeln</span></button><button role="menuitem" data-act="tab" data-t="settings">Einstellungen<span>Darstellung, Team, Daten, App-Schlüssel</span></button></div>
  <main id="app"><section><h2>Lade …</h2></section></main>
</div>
<nav class="tabs" id="nav">
  <button data-act="tab" data-t="liga"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Liga</button>
  <button data-act="tab" data-t="spielen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Spielen</button>
  <button data-act="tab" data-t="training"><svg viewBox="0 0 24 24"><path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/><path d="M15 9l-3 3"/></svg>Training</button>
  <button data-act="tab" data-t="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Statistik</button>
</nav>
<div id="toast" hidden></div>
<div id="ptr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></div>

<script>
// Adresse des Cloudflare-Helfers (wird beim Einrichten eingetragen)
const API = 'https://dirty-checkers-darts.magtnb.workers.dev';

// ---------- Helfer
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (n, d = 1) => n == null || !isFinite(n) ? '–' : n.toFixed(d).replace('.', ',');
const pct = (a, b) => b ? fmt(a / b * 100, 0) + ' %' : '–';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
// Hell / Dunkel / System: data-theme am html steuert die Farbstufen, theme-color färbt die Browserleiste mit
function applyTheme() {
  const t = LS.get('darts.theme', 'dark'), light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = light ? '#ffffff' : '#141415';
}
applyTheme(); matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);
const pDate = s => { const [d, m, y] = s.split('.'); return new Date(+y, m - 1, +d) };
const dShort = ts => new Date(ts).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit' });
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800) }

// ---------- Speicher: Spieler, Spiele, Trainings – lokal sofort, dann über den Helfer auf alle Geräte
const COLS = ['profiles', 'matches', 'trainings', 'ideas'];
const Store = {
  data: { profiles: {}, matches: {}, trainings: {}, ideas: {} }, key: LS.get('darts.key', ''), state: 'lokal', outbox: LS.get('darts.outbox', []), flushing: false,
  init() { COLS.forEach(c => this.data[c] = LS.get('darts.' + c, {})); this.sync() },
  async sync() {
    if (!this.key) { this.state = 'nokey'; softRender(); return }
    try {
      await this.flush();
      const r = await fetch(API + '/data', { headers: { 'X-App-Key': this.key } });
      if (r.status === 401) { this.state = 'badkey'; softRender(); return }
      if (!r.ok) throw 0;
      const d = await r.json();
      COLS.forEach(c => this.data[c] = d[c] || {});
      this.outbox.forEach(o => { if (o.op === 'put') this.data[o.c][o.id] = o.obj; else delete this.data[o.c][o.id] });
      COLS.forEach(c => LS.set('darts.' + c, this.data[c]));
      this.state = 'ok';
    } catch { this.state = 'offline' }
    softRender();
  },
  async flush() {
    if (this.flushing || !this.key) return; this.flushing = true;
    try {
      while (this.outbox.length) {
        const o = this.outbox[0];
        const r = await fetch(`${API}/data/${o.c}/${o.id}`, { method: o.op === 'put' ? 'PUT' : 'DELETE', headers: { 'X-App-Key': this.key, 'Content-Type': 'application/json' }, body: o.op === 'put' ? JSON.stringify(o.obj) : undefined });
        if (r.status === 401) { this.state = 'badkey'; break }
        if (!r.ok) throw 0;
        this.outbox.shift(); LS.set('darts.outbox', this.outbox);
      }
    } finally { this.flushing = false }
  },
  queue(o) { this.outbox = this.outbox.filter(x => !(x.c === o.c && x.id === o.id)); this.outbox.push(o); LS.set('darts.outbox', this.outbox); this.flush().catch(() => { this.state = 'offline' }) },
  list(c) { return Object.entries(this.data[c]).map(([id, v]) => ({ ...v, id })) },
  put(c, id, obj) { this.data[c] = { ...this.data[c], [id]: obj }; LS.set('darts.' + c, this.data[c]); this.queue({ op: 'put', c, id, obj }) },
  del(c, id) { const o = { ...this.data[c] }; delete o[id]; this.data[c] = o; LS.set('darts.' + c, o); this.queue({ op: 'del', c, id }) }
};
// Maggi ist das Hauptprofil (Training, Bot, Statistik); weitere Spieler sind nur Gegner im Spiel.
// Entfernte Spieler bekommen hidden: true, damit ihre alten Spiele lesbar bleiben.
const MAIN_NAME = 'maggi';
const mainPid = () => { const l = Store.list('profiles').filter(p => !p.hidden); return ((l.find(p => p.name.toLowerCase() === MAIN_NAME) || l.sort((a, b) => (a.created || 0) - (b.created || 0))[0]) || {}).id || null };
const profiles = () => { const m = mainPid(); return Store.list('profiles').filter(p => !p.hidden).sort((a, b) => (b.id === m) - (a.id === m) || a.name.localeCompare(b.name, 'de')) };
const pname = id => id === BOT ? 'Bot' : (Store.data.profiles[id] || {}).name || 'Unbekannt';

// ---------- Dart-Setup (nur Hauptprofil): Bibliothek und Main-Set liegen im Profil unter gear,
// jedes Spiel und Training speichert das Setup, mit dem gespielt wurde (Namen, kein Verweis).
const GEAR = [['barrel', 'Barrel'], ['point', 'Spitzenlänge'], ['shaft', 'Schaft'], ['length', 'Schaftlänge'], ['flight', 'Flight']];
// sets = feste Kombinationen (Main 1, Main 2, …); Main 1 ist das Standard-Setup und wird zusätzlich als main gespeichert.
// Ältere Profile haben nur main, daraus wird Main 1.
const gearLib = () => {
  const g = (Store.data.profiles[mainPid()] || {}).gear || {}, o = {};
  GEAR.forEach(([k]) => o[k] = g[k] || []);
  o.sets = g.sets ? clone(g.sets) : g.main && GEAR.some(([k]) => g.main[k]) ? [clone(g.main)] : [];
  o.main = o.sets[0] || {};
  return o;
};
function saveGearLib(lib) {
  const pid = mainPid(); if (!pid) return;
  const old = gearLib().main; lib.main = lib.sets[0] || {};
  if (gearSame(gearNow(), old)) setGearNow(setGear(lib.main)); // wer heute das alte Main 1 hatte, bekommt das neue
  Store.put('profiles', pid, { ...clone(Store.data.profiles[pid]), gear: lib });
}
const setName = i => 'Main ' + (i + 1);
// Ein Set darf einen eigenen Namen tragen; ins Spiel wird nur die Kombination übernommen
const setTitle = (i, s) => setName(i) + (s && s.name ? ' · ' + s.name : '');
const setGear = s => { const { name, ...g } = s || {}; return clone(g) };
// Specs lesbar: Barrel vorne, darunter Spitze, Schaft und Flight
function gearSpecs(g) {
  if (!gearHas(g)) return '<span class="muted">ohne Angabe</span>';
  const rest = [g.point && 'Spitze ' + g.point, (g.shaft || g.length) && 'Schaft ' + [g.shaft, g.length].filter(Boolean).join(' '), g.flight && 'Flight ' + g.flight].filter(Boolean);
  return `<span class="gspec"><b>${esc(g.barrel || 'Barrel offen')}</b>${rest.length ? `<span>${esc(rest.join(' · '))}</span>` : ''}</span>`;
}
const setOf = g => gearLib().sets.findIndex(s => gearHas(s) && gearSame(s, g));
// Auswahlliste der festen Sets; act bekommt data-i (Index) und data-v (z. B. der Schlüssel eines Eintrags)
function presetList(g, act, v = '') {
  const sets = gearLib().sets; if (!sets.length) return '';
  return `<div class="list">${sets.map((s, i) => `<button class="li ${gearSame(s, g) ? 'sel' : ''}" data-act="${act}" data-v="${esc(v)}" data-i="${i}"><span class="cap" style="width:64px;white-space:normal">${setName(i)}${s.name ? `<br><span style="color:var(--paper)">${esc(s.name)}</span>` : ''}</span><span class="grow" style="white-space:normal;overflow:visible;padding-block:8px">${gearSpecs(s)}</span>${gearSame(s, g) ? '<span class="small" style="color:var(--ice)">✓</span>' : ''}</button>`).join('')}</div>`;
}
const gearHas = g => !!g && GEAR.some(([k]) => g[k]);
const gearLabel = g => gearHas(g) ? GEAR.map(([k]) => g[k]).filter(Boolean).join(' · ') : 'ohne Angabe';
const gearSame = (a, b) => GEAR.every(([k]) => ((a || {})[k] || '') === ((b || {})[k] || ''));
// Setup für heutige Spiele und Trainings; am nächsten Tag gilt wieder das Main-Set
function gearNow() { const s = LS.get('darts.gearnow', null); return s && s.day === new Date().toDateString() ? clone(s.g) : setGear(gearLib().main) }
const setGearNow = g => LS.set('darts.gearnow', { day: new Date().toDateString(), g });
const withGear = () => { const g = gearNow(); return gearHas(g) ? { gear: g } : {} };
function gearSelects(g, chg, v = '') {
  const lib = gearLib();
  return `<div class="gsel">${GEAR.map(([k, l]) => `<label class="f">${l}<select data-chg="${chg}" data-k="${k}" data-v="${esc(v)}"><option value="">–</option>${lib[k].map(x => `<option ${g && g[k] === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}${g && g[k] && !lib[k].includes(g[k]) ? `<option selected>${esc(g[k])}</option>` : ''}</select></label>`).join('')}</div>`;
}
// Auswahl vor Spiel/Training
function gearPick(open) {
  const lib = gearLib();
  if (!GEAR.some(([k]) => lib[k].length)) return `<section><h3>Dart-Setup</h3><p class="muted small" style="margin:0">Lege unter Zahnrad → Dart-Setup deine Barrels, Schäfte und Flights an. Dann speichert jedes Spiel und Training, womit du gespielt hast.</p><button class="link" data-act="tab" data-t="setup">Zum Dart-Setup →</button></section>`;
  const g = gearNow(), i = setOf(g);
  // Training: Auswahl gleich offen zeigen, damit vor dem Start klar ist, mit welchem Set es zählt
  if (open) return `<section><h3>Mit welchem Set trainierst du?</h3>
    ${presetList(g, 'gearPreset')}${i < 0 ? `<p class="small" style="margin:0">Gerade eingestellt: ${esc(gearLabel(g))} <span style="color:var(--ice)">(individuell)</span></p>` : ''}
    <details class="extra" ${S.gearSingle || !lib.sets.length ? 'open' : ''}><summary data-act="gearSingleToggle">Einzeln anpassen</summary>${gearSelects(g, 'gearnow')}</details>
    <p class="muted small" style="margin:0">Das gewählte Set wird bei Trainingsplan, Übungen und Bot-Spiel gespeichert und gilt heute auch für deine Spiele. Ab morgen ist wieder Main 1 eingestellt.</p></section>`;
  return `<section><details class="extra" ${S.gearOpen ? 'open' : ''}><summary data-act="gearToggle">Dart-Setup: ${i >= 0 ? `<b>${esc(setTitle(i, gearLib().sets[i]))}</b> · ` : ''}${esc(gearLabel(g))}${i < 0 && gearHas(g) ? ' <span class="small" style="color:var(--ice)">(individuell)</span>' : ''}</summary>
    ${presetList(g, 'gearPreset')}
    <details class="extra" ${S.gearSingle ? 'open' : ''}><summary data-act="gearSingleToggle">Einzeln anpassen</summary>${gearSelects(g, 'gearnow')}</details>
    <p class="muted small" style="margin:0">Gilt für heutige Spiele und Trainings. Ab morgen ist wieder Main 1 eingestellt.</p></details></section>`;
}

// ---------- Liga-Daten
let L = null, LIGA_ERR = false;
async function loadLiga() {
  const c = LS.get('darts.liga', null); if (c) L = prepLiga(c);
  softRender();
  try { const r = await fetch(API + '/liga', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); LS.set('darts.liga', j); L = prepLiga(j); LIGA_ERR = false } else if (!L) LIGA_ERR = true }
  catch { if (!L) LIGA_ERR = true }
  softRender();
}
async function refreshLiga() {
  if (S.refreshing) return;
  if (!Store.key) { toast('Zum Aktualisieren bitte zuerst in den Einstellungen den App-Schlüssel eintragen.'); return }
  S.refreshing = true; render();
  try {
    const r = await fetch(API + '/liga/refresh', { method: 'POST', headers: { 'X-App-Key': Store.key } }); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Fehler ' + r.status);
    LS.set('darts.liga', j); L = prepLiga(j); LIGA_ERR = false; toast(j.hinweis || 'Liga-Daten aktualisiert');
  } catch (e) { toast('Aktualisieren fehlgeschlagen: ' + (e.message || 'keine Verbindung')) }
  S.refreshing = false; render();
}
function prepLiga(raw) {
  raw = clone(raw);
  const roundOf = {}, spielOf = {};
  raw.spiele.forEach(s => { roundOf[s.heim + '|' + s.gast] = s.runde; spielOf[s.heim + '|' + s.gast] = s });
  const wdv = {}; raw.spieler.forEach(p => wdv[p.name] = p);
  const P = {};
  const get = (n, team) => P[n] || (P[n] = { name: n, team, sing: 0, singW: 0, dbl: 0, dblW: 0, legs: 0, legsW: 0, darts: 0, pts: 0, best: null, rounds: {} });
  raw.berichte.forEach(b => {
    b.runde = roundOf[b.heim + '|' + b.gast] || 0;
    b.spiel = spielOf[b.heim + '|' + b.gast];
    b.sets.forEach(s => ['heim', 'gast'].forEach(side => {
      const me = s[side], op = s[side === 'heim' ? 'gast' : 'heim'], team = b[side];
      const won = me.gewonnen > op.gewonnen;
      if (s.typ === 'doppel') { me.spieler.forEach(n => { const p = get(n, team); p.dbl++; if (won) p.dblW++ }); return }
      const n = me.spieler[0]; if (!n) return;
      const p = get(n, team); p.team = team; p.sing++; if (won) p.singW++;
      const R = p.rounds[b.runde] || (p.rounds[b.runde] = { darts: 0, pts: 0, legs: 0, legsW: 0, gegner: [] });
      R.gegner.push({ name: op.spieler[0], won, score: me.gewonnen + ':' + op.gewonnen });
      me.legs.forEach(([d, r]) => {
        p.legs++; p.darts += d; p.pts += 501 - r; R.legs++; R.darts += d; R.pts += 501 - r;
        if (r === 0) { p.legsW++; R.legsW++; p.best = p.best == null ? d : Math.min(p.best, d) }
      });
    }));
  });
  Object.values(P).forEach(p => {
    p.avg = p.darts ? p.pts / p.darts * 3 : null;
    const w = wdv[p.name] || {}; p.pass = w.pass; p.s180 = w.s180 || 0; p.hifi = (w.hifi || []).length ? Math.max(...w.hifi) : null;
    Object.values(p.rounds).forEach(R => R.avg = R.darts ? R.pts / R.darts * 3 : null);
  });
  return { ...raw, wdv, players: Object.values(P), byName: P };
}
const teamPlayers = t => L.players.filter(p => p.team === t).sort((a, b) => (b.avg || 0) - (a.avg || 0));
const teamRow = t => L.tabelle.find(r => r.team === t);
const teamInfo = t => L.teams.find(x => x.name === t) || {};
const playedRounds = () => [...new Set(L.spiele.filter(s => s.setsH != null).map(s => s.runde))].sort((a, b) => a - b);
const resPill = (s, team) => {
  if (s.setsH == null) return '';
  const my = s.heim === team ? s.setsH : s.setsG, ot = s.heim === team ? s.setsG : s.setsH;
  return my > ot ? '<span class="pill w">S</span>' : my < ot ? '<span class="pill l">N</span>' : '<span class="pill d">U</span>';
};
const heatCls = a => a == null ? '' : a >= 48 ? 'h3' : a >= 40 ? 'h2' : 'h1';

// ---------- Zustand
const S = {
  tab: LS.get('darts.tab', 'liga'), liga: 'team', team: LS.get('darts.team', 'An Sporran Dirty Checkers'), viewTeam: null,
  round: null, report: null, lplayer: null, lsort: 'avg', lfilter: 'alle', refreshing: false,
  setup: LS.get('darts.setup', { players: [], type: 'x01', start: 501, legs: 2, out: 'double', input: 'dart' }),
  live: LS.get('darts.live', null), mod: 'S', entry: '', ask: null, abortAsk: false,
  plan: LS.get('darts.plan', null), planAbortAsk: false,
  tr: LS.get('darts.trlive', null), trSel: 'atc', trVar: null, trPid: null,
  statPid: null, manage: false, delAsk: null, statMatch: null,
  botOff: LS.get('darts.botoff', 0), botLegs: 6
};
if (S.tab === 'settings') S.tab = 'liga';
const saveLive = () => LS.set('darts.live', S.live);
const saveTr = () => LS.set('darts.trlive', S.tr);

const trMetric = (mode, v) => mode === 'scoring' ? fmt(v, 1) : mode === 'dbl' ? fmt(v, 0) + ' %' : String(Math.round(v));

// ---------- Trainingsplan (komplett ca. 2 h, medium ca. 1 h, kurz ca. 25 min)

const PLAN = [

  { id: 'co1', name: 'Check-Outs I', rule: '3 Darts pro Zahl, von 41 aufwärts, immer +1. Check-Out = 1 Punkt.', rounds: 40, medium: 30, short: 20, goal: 10, input: 'co', target: n => 41 + n },
  { id: 'power', name: 'Power-Scoring', rule: 'Aufnahmen auf Punkte. Der Average (aufgerundet) ist die Punktzahl.', rounds: 34, medium: 20, short: 10, goal: 67, input: 'visit' }, // persönliches Ziel (Original-Plan: 90)
  { id: 'co2', name: 'Check-Outs II', rule: '3 Darts pro Zahl, von 81 aufwärts, immer +1. Check-Out = 1 Punkt.', rounds: 40, medium: 20, short: 0, goal: 10, input: 'co', target: n => 81 + n },
  { id: 'co25', name: '25 Check-Out', rule: '3 Darts, um Rest 25 zu checken. Check-Out = 1 Punkt.', rounds: 20, medium: 15, short: 10, goal: 10, input: 'co', target: () => 25 },
  { id: 'switch', name: 'Switch', rule: 'Je ein Dart auf T20, T19, T18. Jedes Triple = 1 Punkt. Ein Ausreißer (Dart neben dem Zielsegment) pro Runde ist erlaubt, ab zwei Ausreißern zählt die Runde 0.', rounds: 20, medium: 15, short: 10, goal: 10, input: 'switch', target: () => 'T20 · T19 · T18' },

  { id: 'd24', name: '24', rule: '24 / 12 / 6. Pro getroffenem Doppel 1 Punkt.', rounds: 20, medium: 10, short: 0, goal: 20, input: 'count', target: () => '24' },
  { id: 'bo11', name: 'Best of 11 (HNQ Lvl. 7)', rule: 'Sieg = 5 Punkte. Dazu für den Average: ab 52 = 2, ab 57 = 3, ab 62 = 4, ab 67 = 5 Punkte.', rounds: 1, medium: 0, short: 0, goal: 8, input: 'bo11' }
];
const planGame = id => PLAN.find(g => g.id === id);

const PVAR = { voll: 'komplett', medium: 'medium', kurz: 'kurz' };
const savePlan = () => LS.set('darts.plan', S.plan);
// Scoring-Ziel wächst mit: pro Spieler gespeichert (Start 67, Original-Plan 90).
// Jede Session merkt sich das Ziel von damals, damit der Verlauf nicht rückwirkend schlechter aussieht.
const POWER_START = 67;
const powerGoal = pid => (Store.data.profiles[pid] || {}).powerGoal || POWER_START;
const curGoal = (k, pid) => k === 'power' ? powerGoal(pid) : planGame(k).goal;
const goalOf = (s, k) => k === 'power' ? (s.goals && s.goals.power) || POWER_START : planGame(k).goal;
const planGoals = p => p.goals || (p.goals = { power: powerGoal(p.pid) });
// Anheben: Schnitt der letzten 5 Power-Scoring-Ergebnisse seit der letzten Anhebung ≥ Ziel und mindestens 3 davon ≥ Ziel → +3
function checkPowerGoal(pid) {

  if (l.length < 5 || l.reduce((a, b) => a + b, 0) / 5 < G || l.filter(v => v >= G).length < 3) return null;

}
// Best-of-11-Average-Stufen hängen am Scoring-Ziel: Ziel −15/−10/−5/±0 → 2/3/4/5 Punkte (bei Ziel 67: 52/57/62/67)
const bo11Pts = (win, avg, pg = POWER_START) => (win ? 5 : 0) + (avg >= pg ? 5 : avg >= pg - 5 ? 4 : avg >= pg - 10 ? 3 : avg >= pg - 15 ? 2 : 0);
const bo11Rule = pg => `Sieg = 5 Punkte. Dazu für den Average: ab ${pg - 15} = 2, ab ${pg - 10} = 3, ab ${pg - 5} = 4, ab ${pg} = 5 Punkte.`;
const feFmt = v => v == null ? '–' : fmt(v, v % 1 ? 1 : 0);
function planInput(p, val) {

function planFinishGame(p, g, pts) {

  const fe = g.input === 'visit' || g.input === 'bo11' ? pts : pts * g.rounds / n;
  p.results[g.id] = { pts, played: n, fe: Math.round(fe * 10) / 10 };
  p.cur = []; planStep(p);
  toast(`${g.name}: ${pts} Punkte`);
  if (g.id === 'power') { const ng = checkPowerGoal(p.pid); if (ng) { p.raised = ng; savePlan(); toast(`Neues Scoring-Ziel: ${ng}. Gilt ab dem nächsten Training.`) } }
}
// Nächste Einheit; nach der letzten stoppt die Stoppuhr (Start inkl. Warm-Up bis Ende der letzten Einheit)

}
const durFmt = ms => { if (ms == null) return '–'; const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') + ' h' };
// Ø Dauer pro Variante aus den gestoppten Sessions (null, solange keine gestoppt ist)
// Trainingszeit ohne Pausen
const planElapsed = p => (p.end || p.pausedAt || Date.now()) - p.date - (p.pauseMs || 0);
const clockFmt = ms => { const t = Math.max(0, Math.round(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') };
const planAvgDur = (pid, variant) => { const d = planSessions(pid).filter(s => s.variant === variant && s.dauer > 60000).map(s => s.dauer); return d.length ? { ms: d.reduce((a, b) => a + b, 0) / d.length, n: d.length } : null };
// Zielerreichung neu rechnen (Ziele aus dem Plan aktuell, Scoring-Ziel wie damals gespeichert)
const planPct = s => { const ids = Object.keys(s.results).filter(planGame), z = ids.reduce((a, k) => a + goalOf(s, k), 0); return z ? ids.reduce((a, k) => a + s.results[k].fe, 0) / z * 100 : 0 };
const planSessions = pid => Store.list('trainings').filter(t => t.mode === 'plan' && t.pid === pid && t.results).sort((a, b) => a.date - b.date);

// ---------- Diagramm
function chart(pts, { h = 170, fy = v => fmt(v, 1), label = 'Verlauf', goal = null } = {}) {
  if (pts.length < 2) return '<p class="muted small" style="margin:0">Ab zwei Einträgen erscheint hier der Verlauf.</p>';
  const W = 600, H = h, pl = 44, pr = 16, pt = 16, pb = 26;
  // goal: eine Zahl oder pro Punkt eine (Ziel, das mitwächst → Stufenlinie)
  const gs = goal == null ? null : Array.isArray(goal) ? goal : pts.map(() => goal);
  const ys = pts.map(p => p.y).concat(gs || []); let lo = Math.min(...ys), hi = Math.max(...ys);
  const raw = (hi - lo) / 3 || Math.max(1, Math.abs(hi) * .1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const X = i => pl + i * (W - pl - pr) / (pts.length - 1), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = '';
  // "Ziel" steht links in der Achsenspalte; Achsenwerte zu nah daran fallen weg
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/>${gs && Math.abs(Y(v) - Y(gs[0])) < 12 ? '' : `<text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${esc(fy(v))}</text>`}`;
  if (gs) {
    let d = `M${pl},${Y(gs[0])}`; for (let i = 1; i < gs.length; i++) if (gs[i] !== gs[i - 1]) { const x = (X(i - 1) + X(i)) / 2; d += `H${x}V${Y(gs[i])}` }
    g += `<path class="goal" fill="none" d="${d}H${W - pr}"/><text class="ax" x="${pl - 6}" y="${Y(gs[0]) + 4}" text-anchor="end">Ziel</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${line}L${X(pts.length - 1)},${Y(lo)}L${X(0)},${Y(lo)}Z`;
  const last = pts[pts.length - 1], lx = X(pts.length - 1), ly = Y(last.y);

  const dots = pts.length <= 24 ? pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${X(i)}" cy="${Y(p.y)}" r="2.5"/>${pts.length <= 15 ? `<text class="vl" x="${X(i)}" y="${Y(p.y) - 9}" text-anchor="${i ? 'middle' : 'start'}">${esc(fy(p.y))}</text>` : ''}`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}
    <circle class="end" cx="${lx}" cy="${ly}" r="4.5"/><text class="lbl" x="${lx - 8}" y="${ly - 10}" text-anchor="end">${esc(fy(last.y))}</text>
    <text class="ax" x="${pl}" y="${H - 6}">${esc(pts[0].x)}</text><text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(last.x)}</text></svg>`;
}

// Stärken/Schwächen: jeder Bereich in % vom Ziel (Ziele wie im Trainingsplan), Medium- und Kurz-Sessions hochgerechnet.

const RADAR = [

  ['d40', '40er'], ['d32', '32er'], ['d24', '24er'], ['dbl', 'Doppelquote'], ['comatch', 'Checkout Spiel'], ['bo11', 'Best of 11']

function radarData(pid) {
  const s = {}; const add = (k, date, pct) => (s[k] = s[k] || []).push({ date, pct });
  planSessions(pid).forEach(x => Object.entries(x.results).forEach(([k, r]) => add(k === 'switch' ? 'treble' : k, x.date, r.fe / goalOf(x, k) * 100)));

    if (t.mode === 'dbl') add('dbl', t.date, t.metric / 33 * 100);              // Ziel: jedes dritte Doppel
    if (t.mode === 'treble' && t.extra) add('treble', t.date, t.extra.triple / 7.5 * 100); // Ziel: 25 % Triple
    if (t.mode === 'scoring') add('power', t.date, t.metric / ((t.extra && t.extra.ziel) || POWER_START) * 100);

  return RADAR.filter(([k]) => s[k]).map(([k, name]) => {
    const l = s[k].sort((a, b) => a.date - b.date), avg = a => a.reduce((x, y) => x + y.pct, 0) / a.length;

// o: Skala (max, rings, goal) und Texte; Standard = Stärken/Schwächen in % vom Ziel
function radar(ax, o = {}) {
  const { max: MAX = 150, rings = [50, 100, 150], goal = 100, val = a => Math.round(a.cur) + '%', tip = a => `${Math.round(a.cur)} % vom Ziel (${a.n} Einträge)`, aria = 'Stärken und Schwächen in Prozent vom Ziel',
    legend = `<span><i class="lg-cur"></i>Aktuell (letzte 5)</span>${ax.every(a => a.prev != null) ? '<span><i class="lg-prev"></i>Die 5 davor</span>' : ''}<span><i class="lg-goal"></i>Ziel = 100 %</span>` } = o;

  const poly = vals => vals.map((v, i) => P(i, v).map(c => c.toFixed(1)).join(',')).join(' ');
  let g = [...new Set([...rings, goal])].map(v => `<polygon class="${v === goal ? 'goal' : 'grid'}" fill="none" points="${poly(ax.map(() => v))}"/>`).join('');
  g += ax.map((_, i) => { const [x, y] = P(i, MAX); return `<line class="grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>` }).join('');
  const showPrev = ax.every(a => a.prev != null);
  const prev = showPrev ? `<polygon class="rprev" points="${poly(ax.map(a => a.prev))}"/>` : '';
  const cur = `<polygon class="ar" points="${poly(ax.map(a => a.cur))}"/><polygon class="ln" points="${poly(ax.map(a => a.cur))}"/>`;
  const dots = ax.map((a, i) => { const [x, y] = P(i, a.cur); return `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"><title>${esc(a.name)}: ${esc(tip(a))}</title></circle>` }).join('');
  const labels = ax.map((a, i) => {
    const [x, y] = P(i, MAX + 22), anc = x > cx + 8 ? 'start' : x < cx - 8 ? 'end' : 'middle', dy = y < cy - R ? -4 : y > cy + R ? 12 : 4;
    return `<text class="ax" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anc}">${esc(a.name)} <tspan class="rval">${esc(val(a))}</tspan></text>`;
  }).join('');
  return `<svg class="chart radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}${prev}${cur}${dots}${labels}</svg>
    <div class="legend">${legend}</div>`;
}

// Voraussichtliche Aufstellung aus den letzten Spielberichten: je Set, wer dort zuletzt gespielt hat,
// neuere Spiele zählen mehr. Im Einzel spielt jeder höchstens einmal, im Doppel zählt das Paar.
const LINEUP_N = 6, LINEUP_DECAY = .8;
function lineup(team) {
  const bs = L.berichte.filter(b => b.heim === team || b.gast === team).sort((a, b) => b.runde - a.runde).slice(0, LINEUP_N);
  if (!bs.length) return null;
  const tot = bs.reduce((a, _, i) => a + LINEUP_DECAY ** i, 0), cnt = {};
  bs.forEach((b, i) => { const side = b.heim === team ? 'heim' : 'gast'; b.sets.forEach(s => {
    const who = s[side].spieler.filter(n => !/nicht angetreten|\[name\]/i.test(n)).sort((x, y) => x.localeCompare(y, 'de')).join(' / '); if (!who) return;
    const c = cnt[s.nr] || (cnt[s.nr] = { nr: s.nr, typ: s.typ, w: {} }); c.w[who] = (c.w[who] || 0) + LINEUP_DECAY ** i;
  }) });
  const slots = Object.values(cnt).sort((a, b) => a.nr - b.nr), used = new Set();
  // Einzel: stärkste Zuordnung zuerst, damit niemand zweimal auftaucht
  slots.filter(s => s.typ === 'einzel').flatMap(s => Object.entries(s.w).map(([p, w]) => ({ s, p, w }))).sort((a, b) => b.w - a.w)
    .forEach(({ s, p, w }) => { if (!s.pick && !used.has(p)) { s.pick = p; s.pw = w; used.add(p) } });
  // Doppel: direkt aufeinanderfolgende Doppel-Sets (z. B. 3 und 4) laufen parallel, dort spielt jeder nur einmal.
  // Je Block wird die Kombination mit dem höchsten Gesamtgewicht gesucht.
  const blocks = []; slots.forEach((s, i) => { if (s.typ === 'einzel') return; if (i && slots[i - 1].typ !== 'einzel' && slots[i - 1].nr === s.nr - 1) blocks[blocks.length - 1].push(s); else blocks.push([s]) });
  blocks.forEach(bl => {
    let best = null;
    const go = (i, taken, sum, picks) => {
      if (i === bl.length) { if (!best || sum > best.sum) best = { sum, picks }; return }
      const c = Object.entries(bl[i].w).filter(([p]) => !p.split(' / ').some(x => taken.has(x)));
      if (!c.length) return go(i + 1, taken, sum, [...picks, null]);
      c.forEach(([p, w]) => go(i + 1, new Set([...taken, ...p.split(' / ')]), sum + w, [...picks, [p, w]]));
    };
    go(0, new Set(), 0, []);
    bl.forEach((s, i) => { const q = best.picks[i]; if (q) { s.pick = q[0]; s.pw = q[1] } });

    s.alt = Object.entries(s.w).filter(([p]) => p !== s.pick).sort((a, b) => b[1] - a[1])[0] || null;

// Voraussichtliche Paarungen gegen den nächsten Gegner: je Set unsere und deren wahrscheinlichste Besetzung
function vLineup(team, next) {

  const me = (Store.data.profiles[mainPid()] || {}).wdv;

    <span>${nm(s.pick)}</span><span class="cap">${s.pct} %${s.typ === 'einzel' && L.byName[s.pick] && L.byName[s.pick].avg != null ? ' · Ø ' + fmt(L.byName[s.pick].avg, 1) : ''}</span>${s.alt ? `<span class="muted small">sonst ${nm(s.alt[0])}</span>` : ''}</div>`;
  const nrs = [...new Set([...lu.slots, ...(ou ? ou.slots : [])].map(s => s.nr))].sort((a, b) => a - b);
  const at = (x, nr) => x && x.slots.find(s => s.nr === nr);

    <div class="list">${nrs.map(nr => { const a = at(lu, nr), b = at(ou, nr), typ = (a || b).typ;
      return `<div class="li mu"><span class="cap mu-n">Set ${nr} · ${typ === 'einzel' ? 'Einzel' : 'Doppel'}${a && b && a.pick && b.pick ? ` · Paarung ${Math.round(a.pct * b.pct / 100)} %` : ''}</span>
        <div class="mu-row">${side(a, false)}${ou ? `<span class="mu-vs">vs.</span>${side(b, true)}` : ''}</div></div>` }).join('')}</div>
    <p class="muted small" style="margin:0">Rein statistisch aus den letzten Spielberichten (${esc(team)}: ${lu.n}${ou ? `, ${esc(opp)}: ${ou.n}` : ''}), neuere zählen mehr. Die Prozentzahl je Spieler sagt, wie sicher der Platz zuletzt so besetzt war. Die Paarung ist beides zusammen: wie wahrscheinlich genau diese zwei gegeneinander spielen. Ø = Liga-Average.</p></section>`;

// ---------- Aufstellungs-Helfer
// Leg-Chance aus der Average-Differenz, geeicht an allen Sets der Liga (Einzel Skala 7,5, Doppel 5,5 Punkte).
// Bei wenigen Legs wird der Average Richtung Ligaschnitt gezogen (Gewicht 8 Legs); wer nur Doppel spielt, gilt als etwas unter dem Schnitt.
const LU_K = 8, LU_SC = { einzel: 7.5, doppel: 5.5 };
const LU_SETS = [[1, 'einzel'], [2, 'einzel'], [3, 'doppel'], [4, 'doppel'], [5, 'einzel'], [6, 'einzel'], [7, 'doppel'], [8, 'doppel']];
function luStrength() {
  const ps = L.players.filter(p => p.darts), mean = ps.reduce((a, p) => a + p.pts, 0) / ps.reduce((a, p) => a + p.darts, 0) * 3;
  const one = n => { const p = L.byName[n]; return p && p.legs && p.avg != null ? (p.legs * p.avg + LU_K * mean) / (p.legs + LU_K) : mean - 4 };
  return who => who ? who.split(' / ').reduce((a, n) => a + one(n), 0) / who.split(' / ').length : mean;
}
const setWin = (a, b, typ) => { const p = 1 / (1 + Math.exp(-(a - b) / LU_SC[typ])), q = 1 - p; return typ === 'einzel' ? p ** 3 * (1 + 3 * q + 6 * q * q) : p * p * (1 + 2 * q) };
// Chance je Set gegen die wahrscheinlichen Gegner dieses Sets (gewichtet wie in der Prognose)
function luEval(picks, ou, st) {
  const sets = LU_SETS.map(([nr, typ]) => {
    const who = picks[nr] || null, os = ou && ou.slots.find(x => x.nr === nr);
    const opts = os ? Object.entries(os.w) : [[null, 1]], tw = opts.reduce((a, o) => a + o[1], 0);
    const p = who ? opts.reduce((a, [o, w]) => a + w / tw * setWin(st(who), st(o), typ), 0) : 0;
    return { nr, typ, who, p, opp: os && os.pick, oppPct: os && os.pct };
  });
  let d = [1]; sets.forEach(x => { const n = Array(d.length + 1).fill(0); d.forEach((v, k) => { n[k] += v * (1 - x.p); n[k + 1] += v * x.p }); d = n });
  const win = d.slice(5).reduce((a, b) => a + b, 0), draw = d[4] || 0;
  return { sets, win, draw, loss: 1 - win - draw, exp: sets.reduce((a, x) => a + x.p, 0) };
}
// Beste Aufstellung aus den verfügbaren Spielern: im Einzel jeder höchstens einmal, in jedem Doppel-Block (3+4, 7+8) auch.
function luPlan(sel, ou) {
  const st = luStrength(), picks = {}, chance = (who, nr) => luEval({ [nr]: who }, ou, st).sets.find(x => x.nr === nr).p;
  const sNr = LU_SETS.filter(x => x[1] === 'einzel').map(x => x[0]);
  let best = null;
  const goS = (i, used, sum, acc) => {
    if (i === sNr.length) { if (!best || sum > best.sum) best = { sum, acc }; return }
    const c = sel.filter(n => !used.includes(n)); if (!c.length) return goS(i + 1, used, sum, [...acc, null]);
    c.forEach(n => goS(i + 1, [...used, n], sum + chance(n, sNr[i]), [...acc, n]));
  };
  goS(0, [], 0, []); sNr.forEach((nr, i) => picks[nr] = best.acc[i]);
  const pairs = sel.flatMap((a, i) => sel.slice(i + 1).map(b => [a, b].sort((x, y) => x.localeCompare(y, 'de')).join(' / ')));
  [[3, 4], [7, 8]].forEach(bl => {
    let bb = null;
    const go = (i, used, sum, acc) => {
      if (i === bl.length) { if (!bb || sum > bb.sum) bb = { sum, acc }; return }
      const c = pairs.filter(p => !p.split(' / ').some(n => used.includes(n))); if (!c.length) return go(i + 1, used, sum, [...acc, null]);
      c.forEach(p => go(i + 1, [...used, ...p.split(' / ')], sum + chance(p, bl[i]), [...acc, p]));

function vPlanner(team, next) {

      <tr><td><b>Summe</b></td><td></td><td class="n" style="color:var(--paper)">${feFmt(Math.round(punkte * 10) / 10)}</td><td class="n">${ziel}</td></tr></tbody></table></div>

// Weg zum Checkout: wie viele Aufnahmen bis Rest ≤ 170 (zwei hohe Triple + Doppel) und bis unter 100
function vPath(pid, xs) {
  const starts = [501, 301, 701].filter(s => xs.some(m => m.start === s));
  if (!starts.length) return '';
  const blocks = starts.map(s => {
    const list = xs.filter(m => m.start === s), w = pathAvg(list, pid);
    const per = list.map(m => ({ x: dShort(m.date), p: pathAvg([m], pid) })).slice(-30);
    const c = (k, label) => { const pts = per.filter(q => q.p[k] != null).map(q => ({ x: q.x, y: q.p[k] })); return pts.length >= 2 ? `<div class="card"><div class="bar"><span>${label}</span><span class="cap">weniger ist besser</span></div>${chart(pts, { h: 120, label, fy: v => fmt(v, 1) })}</div>` : '' };
    return `<h3>${s} · ${list.length} ${list.length === 1 ? 'Spiel' : 'Spiele'}</h3>
      <div class="kpis"><div class="kpi"><b>${fmt(w.r170, 1)}</b><span>Aufn. bis 170</span></div><div class="kpi"><b>${fmt(w.r100, 1)}</b><span>Aufn. bis unter 100</span></div><div class="kpi"><b>${fmt(w.rWin, 1)}</b><span>Aufn. pro gewonnenem Leg</span></div></div>
      ${c('r170', `${s}: Aufnahmen bis 170`)}${c('r100', `${s}: Aufnahmen bis unter 100`)}`;
  }).join('');
  return `<section><h3>Weg zum Checkout</h3>${blocks}
    <p class="muted small" style="margin:0">Durchschnitt pro Leg: Aufnahmen, bis dein Rest bei 170 oder weniger liegt (zwei hohe Triple und Doppel) bzw. unter 100. Legs, in denen du den Bereich nicht erreicht hast, zählen nicht mit.</p></section>`;
}
// Doppel im Spiel als eigenes Spinnennetz (Trefferquote je Doppel)
function vDoubles(pid, xs) {
  const all = dblStats(xs, pid), name = k => k === 25 ? 'Bull' : 'D' + k;
  if (!all.length) return `<section><h3>Doppel im Spiel</h3><p class="muted small" style="margin:0">Sobald du X01 mit Eingabe „Pro Dart“ spielst, siehst du hier, welche Doppel gut funktionieren.</p></section>`;
  const order = [...BOARD, 25];
  const ax = all.filter(d => d.att >= 3).sort((a, b) => order.indexOf(a.k) - order.indexOf(b.k)).map(d => ({ name: name(d.k), cur: d.hit / d.att * 100, n: d.att, hit: d.hit }));
  const tot = all.reduce((a, d) => ({ att: a.att + d.att, hit: a.hit + d.hit }), { att: 0, hit: 0 });
  const max = Math.min(100, Math.max(60, Math.ceil(Math.max(...ax.map(a => a.cur), 0) / 20) * 20));
  const rated = all.filter(d => d.att >= 5).sort((a, b) => b.hit / b.att - a.hit / a.att), k = rated.length >= 6 ? 3 : 2;
  const item = d => `<div><span class="mono" style="color:var(--paper)">${pct(d.hit, d.att)}</span> ${name(d.k)} <span class="muted small">${d.hit}/${d.att}</span></div>`;
  return `<section><h3>Doppel im Spiel · ${pct(tot.hit, tot.att)} gesamt</h3>
    ${ax.length >= 3 ? `<div class="card">${radar(ax, { max, rings: [max / 3, max * 2 / 3, max].map(Math.round), goal: 33, aria: 'Trefferquote je Doppel im Spiel', val: a => `${Math.round(a.cur)}% ${a.hit}/${a.n}`, tip: a => `${a.hit} von ${a.n} getroffen`, legend: '<span><i class="lg-cur"></i>Trefferquote je Doppel</span><span><i class="lg-goal"></i>33 % = jeder dritte Dart</span>' })}</div>` : '<p class="muted small" style="margin:0">Das Spinnennetz erscheint, sobald du auf mindestens drei verschiedene Doppel je dreimal geworfen hast.</p>'}
    ${rated.length >= 4 ? `<div class="rgrid"><div class="card"><span class="cap">Läuft gut</span>${rated.slice(0, k).map(item).join('')}</div><div class="card"><span class="cap">Woran arbeiten</span>${rated.slice(-k).reverse().map(item).join('')}</div></div>` : ''}
    <details><summary class="muted small">Alle Doppel</summary><div class="tbl"><table><thead><tr><th>Doppel</th><th class="r">Versuche</th><th class="r">Treffer</th><th class="r">Quote</th></tr></thead><tbody>
      ${all.sort((a, b) => b.att - a.att).map(d => `<tr><td>${name(d.k)}</td><td class="n">${d.att}</td><td class="n">${d.hit}</td><td class="n" style="color:var(--paper)">${pct(d.hit, d.att)}</td></tr>`).join('')}</tbody></table></div></details>
    <p class="muted small" style="margin:0">Jeder Dart, den du bei einem Rest mit direktem Doppel-Finish wirfst (2 bis 40 gerade oder 50), zählt als Versuch auf dieses Doppel. Nur Spiele mit Eingabe „Pro Dart“, denn nur dort kennt die App jeden einzelnen Pfeil.</p></section>`;
}

// ---------- Rendern
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  $('#menu').hidden = !S.menu;
  const views = { liga: vLiga, spielen: vSpielen, training: vTraining, stats: vStats, settings: vSettings, setup: vSetup, ideas: vIdeas };
  $('#app').innerHTML = views[S.tab]();
  // Laufendes Spiel: kompakte Ansicht ohne Kopfzeile, damit Stand und Eingabe auf einen Bildschirm passen
  document.body.classList.toggle('live', S.tab === 'spielen' && !!S.live && !S.live.done);
  $('#stamp').innerHTML = L ? 'Liga-Stand<br>' + esc(new Date(L.aktualisiert).toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })) : '';
  $('#refreshBtn').classList.toggle('spin', S.refreshing);
  // Bot ist dran: ein Dart nach dem anderen, damit man mitlesen kann
  if (!botT && S.tab === 'spielen' && isBotTurn(S.live) && !S.abortAsk) botT = setTimeout(botTick, S.live.pending.length ? 650 : 900);
}
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT' || a.tagName === 'TEXTAREA')) return;
  if ((S.tab === 'spielen' && S.live && !S.live.done) || (S.tab === 'training' && ((S.tr && !S.tr.done) || (S.plan && S.plan.i < S.plan.steps.length)))) return;
  render();
}
function startBot(pid, legs, planId) {
  if (!pid) return;
  if (S.live && !S.live.done) { S.tab = 'spielen'; return toast('Erst das laufende Spiel beenden.') }
  S.live = newMatch({ type: 'x01', start: 501, legs, out: 'double', input: S.setup.input || 'dart', players: [pid, BOT], bot: { avg: botAvg(pid) }, planId });
  S.mod = 'S'; S.entry = ''; S.abortAsk = false; S.ask = null; saveLive();

    if (y0 == null) return; y0 = null; el.classList.add('go');
