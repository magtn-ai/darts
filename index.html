<style>
/* Layout: dunkles Terminal, eine kompakte Spalte, Tonstufen statt Schatten, Tab-Leiste unten */
:root{
  --void:#080809; --obsidian:#141415; --charcoal:#1b1d1f; --graphite:#26272d; --slate:#3c3d40; --iron:#34353c;
  --fog:#acadae; --paper:#ffffff; --ice:#83c3ff; --neg:#e24756;
  --ice-08:rgba(131,195,255,.08); --ice-20:rgba(131,195,255,.2); --neg-15:rgba(226,71,86,.16); --ring:inset 0 0 0 1px rgba(255,255,255,.08);

  --r-sm:4px; --r-lg:8px; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--void)}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--obsidian)}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--obsidian);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ice);display:inline-block}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--fog);margin-left:auto;text-align:right;line-height:1.25}
.ibtn{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--iron);background:transparent;display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px;fill:none;stroke:var(--paper);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;line-height:1.25}
h2{font-size:24px;letter-spacing:-.01em}
h3{font-size:12px;font-weight:500;color:var(--fog);text-transform:uppercase;letter-spacing:.08em}
main{display:flex;flex-direction:column;gap:32px;padding-block:16px 32px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--fog)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:30px;border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--ice);background:var(--ice-08);color:var(--paper)}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:500;white-space:nowrap;color:var(--fog)}
.seg button.on{border-color:var(--ice);color:var(--paper);background:var(--ice-08)}
.btn{border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:10px 16px;font-weight:500;font-size:14px}
.btn.primary{border-color:var(--ice)}
.btn.primary:hover{border-color:var(--paper)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.block{width:100%}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

td.c,th.c{text-align:center} th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--ice-08)}
tr.me td:first-child{box-shadow:inset 2px 0 0 var(--ice)}
tr.tap{cursor:pointer}
tr.tap:hover td{background:rgba(60,61,64,.5)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.li.sel{box-shadow:inset 2px 0 0 var(--ice);background:var(--ice-08)}
.li .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.score{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}

.next .vs{font-size:20px;font-weight:500;line-height:1.25}
.cap{font-family:var(--f-mono);font-size:12px;color:var(--fog)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--iron);stroke-width:1}
.chart .ax{fill:var(--fog);font-size:12px;font-family:var(--f-mono)}
.chart .ln{fill:none;stroke:var(--ice);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--ice);opacity:.1}
.chart .pt{fill:var(--ice)} .chart .end{fill:var(--void);stroke:var(--ice);stroke-width:2.5}
.chart .goal{stroke:var(--fog);stroke-width:1;stroke-dasharray:4 4}
.good{color:var(--ice)}
.chart .lbl{fill:var(--paper);font-size:13px;font-weight:500;font-family:var(--f-mono)}
.heat td.v{font-family:var(--f-mono);text-align:center;font-size:13px}
.h1{background:var(--neg-15)}.h2{background:var(--ice-08)}.h3{background:var(--ice-20);color:var(--paper)}
/* Scoreboard */
.board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.pl{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pl.act{box-shadow:inset 0 0 0 1px var(--ice);background:var(--graphite)}
.pl .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .rem{font-family:var(--f-mono);font-weight:500;font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pl .sub{font-size:12px;color:var(--fog);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono)}
.pl .co{font-family:var(--f-mono);font-size:13px;color:var(--ice);min-height:20px}
.darts{display:flex;gap:8px;min-height:34px}
.darts span{min-width:56px;text-align:center;border:1px dashed var(--iron);border-radius:var(--r-sm);padding:4px 6px;font-family:var(--f-mono);font-size:16px;font-weight:500}
.darts span.f{border-style:solid;background:var(--graphite)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{border:1px solid var(--iron);background:var(--charcoal);border-radius:var(--r-sm);height:52px;font-family:var(--f-mono);font-size:18px;font-weight:500}
.pad button:active{background:var(--slate)}
.pad .wide{grid-column:span 2}
.pad .mods{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad .mods button{font-family:var(--f-ui);font-size:15px;height:44px}
.pad .mods button.on{border-color:var(--paper);background:var(--slate)}
.pad .mods button.d.on{border-color:var(--ice);color:var(--ice);background:var(--ice-08)}
.pad .mods button.t.on{border-color:var(--neg);color:var(--neg);background:var(--neg-15)}
.pad .act{background:var(--graphite)}
.pad.np{grid-template-columns:repeat(3,1fr)}
.pad .ok{border-color:var(--ice);color:var(--ice)}
.entry{font-family:var(--f-mono);font-size:40px;font-weight:500;text-align:center;background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:4px;min-height:60px;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);height:36px;font-family:var(--f-mono);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbig{font-family:var(--f-mono);font-size:64px;font-weight:500;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tbtns button{height:64px;font-size:16px;font-weight:500;border-radius:var(--r-sm);border:1px solid var(--iron);background:var(--charcoal)}
.tbtns .hit{border-color:var(--ice);color:var(--ice);background:var(--ice-08)}
.tbtns .miss{background:var(--graphite);color:var(--fog)}
.note{background:var(--graphite);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;font-size:14px}
.note.warn{box-shadow:inset 0 0 0 1px var(--neg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--obsidian);border-top:1px solid var(--iron);display:grid;grid-template-columns:repeat(4,1fr);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--fog);padding:8px 0;box-shadow:inset 0 2px 0 transparent}
nav.tabs button.on{color:var(--paper);box-shadow:inset 0 2px 0 var(--ice)}
nav.tabs button.on svg{stroke:var(--ice)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graphite);box-shadow:var(--ring);color:var(--paper);padding:10px 14px;border-radius:var(--r-lg);font-size:14px;z-index:20;max-width:90vw}
.set{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--iron)}
.set:last-child{border-bottom:0}
.set .h{min-width:0}.set .g{text-align:right;min-width:0}
.legs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.set .g .legs{justify-content:flex-end}
.legs i{font-style:normal;font-family:var(--f-mono);font-size:12px;padding:0 5px;border-radius:var(--r-sm);background:var(--graphite);color:var(--fog)}
.legs i.w{background:var(--ice-20);color:var(--ice)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><i></i>Dirty Checkers</div>
    <div class="stamp" id="stamp"></div>
    <button class="ibtn" id="refreshBtn" data-act="refreshLiga" aria-label="Liga-Daten aktualisieren"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="ibtn" data-act="tab" data-t="settings" aria-label="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="app"><section><h2>Lade …</h2></section></main>
</div>
<nav class="tabs" id="nav">
  <button data-act="tab" data-t="liga"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>Liga</button>
  <button data-act="tab" data-t="spielen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/></svg>Spielen</button>
  <button data-act="tab" data-t="training"><svg viewBox="0 0 24 24"><path d="M4 20l6-6M14 4l6 6-8 8-6-6z"/><path d="M15 9l-3 3"/></svg>Training</button>

<script>
// Adresse des Cloudflare-Helfers (wird beim Einrichten eingetragen)
const API = 'https://dirty-checkers-darts.magtnb.workers.dev';

// ---------- Helfer
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (n, d = 1) => n == null || !isFinite(n) ? '–' : n.toFixed(d).replace('.', ',');
const pct = (a, b) => b ? fmt(a / b * 100, 0) + ' %' : '–';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const pDate = s => { const [d, m, y] = s.split('.'); return new Date(+y, m - 1, +d) };
const dShort = ts => new Date(ts).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit' });
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800) }

// ---------- Speicher: Spieler, Spiele, Trainings – lokal sofort, dann über den Helfer auf alle Geräte
const COLS = ['profiles', 'matches', 'trainings'];
const Store = {
  data: { profiles: {}, matches: {}, trainings: {} }, key: LS.get('darts.key', ''), state: 'lokal', outbox: LS.get('darts.outbox', []), flushing: false,
  init() { COLS.forEach(c => this.data[c] = LS.get('darts.' + c, {})); this.sync() },
  async sync() {
    if (!this.key) { this.state = 'nokey'; softRender(); return }
    try {
      await this.flush();
      const r = await fetch(API + '/data', { headers: { 'X-App-Key': this.key } });
      if (r.status === 401) { this.state = 'badkey'; softRender(); return }
      if (!r.ok) throw 0;
      const d = await r.json();
      COLS.forEach(c => this.data[c] = d[c] || {});
      this.outbox.forEach(o => { if (o.op === 'put') this.data[o.c][o.id] = o.obj; else delete this.data[o.c][o.id] });
      COLS.forEach(c => LS.set('darts.' + c, this.data[c]));
      this.state = 'ok';
    } catch { this.state = 'offline' }
    softRender();
  },
  async flush() {
    if (this.flushing || !this.key) return; this.flushing = true;
    try {
      while (this.outbox.length) {
        const o = this.outbox[0];
        const r = await fetch(`${API}/data/${o.c}/${o.id}`, { method: o.op === 'put' ? 'PUT' : 'DELETE', headers: { 'X-App-Key': this.key, 'Content-Type': 'application/json' }, body: o.op === 'put' ? JSON.stringify(o.obj) : undefined });
        if (r.status === 401) { this.state = 'badkey'; break }
        if (!r.ok) throw 0;
        this.outbox.shift(); LS.set('darts.outbox', this.outbox);
      }
    } finally { this.flushing = false }
  },
  queue(o) { this.outbox = this.outbox.filter(x => !(x.c === o.c && x.id === o.id)); this.outbox.push(o); LS.set('darts.outbox', this.outbox); this.flush().catch(() => { this.state = 'offline' }) },
  list(c) { return Object.entries(this.data[c]).map(([id, v]) => ({ ...v, id })) },
  put(c, id, obj) { this.data[c] = { ...this.data[c], [id]: obj }; LS.set('darts.' + c, this.data[c]); this.queue({ op: 'put', c, id, obj }) },
  del(c, id) { const o = { ...this.data[c] }; delete o[id]; this.data[c] = o; LS.set('darts.' + c, o); this.queue({ op: 'del', c, id }) }
};
const profiles = () => Store.list('profiles').sort((a, b) => a.name.localeCompare(b.name, 'de'));
const pname = id => (Store.data.profiles[id] || {}).name || 'Unbekannt';

// ---------- Liga-Daten
let L = null, LIGA_ERR = false;
async function loadLiga() {
  const c = LS.get('darts.liga', null); if (c) L = prepLiga(c);
  softRender();
  try { const r = await fetch(API + '/liga', { cache: 'no-store' }); if (r.ok) { const j = await r.json(); LS.set('darts.liga', j); L = prepLiga(j); LIGA_ERR = false } else if (!L) LIGA_ERR = true }
  catch { if (!L) LIGA_ERR = true }
  softRender();
}
async function refreshLiga() {
  if (S.refreshing) return;
  if (!Store.key) { toast('Zum Aktualisieren bitte zuerst in den Einstellungen den App-Schlüssel eintragen.'); return }

    const r = await fetch(API + '/liga/refresh', { method: 'POST', headers: { 'X-App-Key': Store.key } }); const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Fehler ' + r.status);

  } catch (e) { toast('Aktualisieren fehlgeschlagen: ' + (e.message || 'keine Verbindung')) }

function prepLiga(raw) {

  raw.spiele.forEach(s => { roundOf[s.heim + '|' + s.gast] = s.runde; spielOf[s.heim + '|' + s.gast] = s });
  const wdv = {}; raw.spieler.forEach(p => wdv[p.name] = p);
  const P = {};
  const get = (n, team) => P[n] || (P[n] = { name: n, team, sing: 0, singW: 0, dbl: 0, dblW: 0, legs: 0, legsW: 0, darts: 0, pts: 0, best: null, rounds: {} });
  raw.berichte.forEach(b => {
    b.runde = roundOf[b.heim + '|' + b.gast] || 0;
    b.spiel = spielOf[b.heim + '|' + b.gast];
    b.sets.forEach(s => ['heim', 'gast'].forEach(side => {
      const me = s[side], op = s[side === 'heim' ? 'gast' : 'heim'], team = b[side];
      const won = me.gewonnen > op.gewonnen;
      if (s.typ === 'doppel') { me.spieler.forEach(n => { const p = get(n, team); p.dbl++; if (won) p.dblW++ }); return }
      const n = me.spieler[0]; if (!n) return;
      const p = get(n, team); p.team = team; p.sing++; if (won) p.singW++;
      const R = p.rounds[b.runde] || (p.rounds[b.runde] = { darts: 0, pts: 0, legs: 0, legsW: 0, gegner: [] });
      R.gegner.push({ name: op.spieler[0], won, score: me.gewonnen + ':' + op.gewonnen });
      me.legs.forEach(([d, r]) => {
        p.legs++; p.darts += d; p.pts += 501 - r; R.legs++; R.darts += d; R.pts += 501 - r;
        if (r === 0) { p.legsW++; R.legsW++; p.best = p.best == null ? d : Math.min(p.best, d) }
      });
    }));
  });
  Object.values(P).forEach(p => {
    p.avg = p.darts ? p.pts / p.darts * 3 : null;
    const w = wdv[p.name] || {}; p.pass = w.pass; p.s180 = w.s180 || 0; p.hifi = (w.hifi || []).length ? Math.max(...w.hifi) : null;
    Object.values(p.rounds).forEach(R => R.avg = R.darts ? R.pts / R.darts * 3 : null);
  });
  return { ...raw, wdv, players: Object.values(P), byName: P };
}

// Checkout-Vorschlag: wenigste Darts, dann bevorzugte Doppel (D20, D16, D8 …) und Setup-Würfe
const SETUP = []; for (let n = 20; n >= 1; n--) SETUP.push('T' + n); SETUP.push('D25', 'S25'); for (let n = 20; n >= 1; n--) SETUP.push('S' + n); for (let n = 20; n >= 1; n--) SETUP.push('D' + n);
const DBL = [20, 16, 8, 18, 12, 10, 14, 4, 6, 2, 19, 17, 15, 13, 11, 9, 7, 5, 3, 1].map(n => 'D' + n).concat('D25');
const coMemo = {};
function checkout(rem, darts = 3) {
  const k = rem + '/' + darts; if (k in coMemo) return coMemo[k];
  let best = null, bc = 1e9;
  if (rem >= 2 && rem <= 170) for (let n = 1; n <= darts && !best; n++) {
    const rec = (left, depth, path, cost) => {
      if (depth === n - 1) { const i = DBL.findIndex(d => dartVal(d) === left); if (i >= 0 && cost + i * 2 < bc) { bc = cost + i * 2; best = [...path, DBL[i]] } return }
      SETUP.forEach((s, i) => { const v = dartVal(s); if (v < left - 1) rec(left - v, depth + 1, [...path, s], cost + i) });
    };
    rec(rem, 0, [], 0);
  }
  return coMemo[k] = best;
}
function newMatch(cfg) {
  return { id: uid(), type: cfg.type, start: cfg.start, out: cfg.out, legsToWin: cfg.legs, input: cfg.type === 'cricket' ? 'dart' : cfg.input,
    players: [...cfg.players], legs: [{ starter: 0, winner: null, visits: [] }], pending: [], pendAtts: [], winner: null, createdAt: Date.now() };
}
function x01Dart(m, d) {
  const leg = curLeg(m), p = turnOf(m, leg);
  const before = remOf(m, leg, p) - m.pending.reduce((a, x) => a + dartVal(x), 0);
  const after = before - dartVal(d), dbl = d[0] === 'D';
  const att = m.out !== 'single' && (before === 50 || (before <= 40 && before % 2 === 0)) ? 1 : 0;
  m.pending.push(d); m.pendAtts.push(att);
  const bust = after < 0 || (m.out !== 'single' && after === 1) || (after === 0 && m.out === 'double' && !dbl) || (after === 0 && m.out === 'master' && !(dbl || d[0] === 'T'));
  if (bust) { toast('Überworfen'); return commitVisit(m, true, false) }
  if (after === 0) return commitVisit(m, false, true);
  if (m.pending.length === 3) return commitVisit(m, false, false);
  saveLive();
}
function crState(m, leg, withPending) {
  const st = { marks: m.players.map(() => ({ 20: 0, 19: 0, 18: 0, 17: 0, 16: 0, 15: 0, 25: 0 })), pts: m.players.map(() => 0) };
  leg.visits.forEach(v => v.darts.forEach(d => crApply(st, v.p, d)));
  if (withPending) m.pending.forEach(d => crApply(st, turnOf(m, leg), d));

}
function crApply(st, p, d) {
  if (d === 'M') return; const num = +d.slice(1), mult = { S: 1, D: 2, T: 3 }[d[0]];
  if (!(num in st.marks[p])) return;
  const used = Math.min(mult, Math.max(0, 3 - st.marks[p][num])), extra = mult - used;
  if (extra > 0 && st.marks.some((mm, q) => q !== p && mm[num] < 3)) st.pts[p] += extra * num;

}
const crClosed = mk => [20, 19, 18, 17, 16, 15, 25].every(n => mk[n] >= 3);
function crDart(m, d) {

  if (crClosed(st.marks[p]) && st.pts[p] >= Math.max(...st.pts)) return commitVisit(m, false, true);
  if (m.pending.length === 3) return commitVisit(m, false, false);

}
const crMarks = d => { if (d === 'M') return 0; const n = +d.slice(1); return (n >= 15 && n <= 20) || n === 25 ? { S: 1, D: 2, T: 3 }[d[0]] : 0 };

  leg.visits.push({ p, darts, atts: [...m.pendAtts], score, bust, n: darts.length, att: m.pendAtts.reduce((a, b) => a + b, 0), co });

function matchStats(m) {

// ---------- Diagramm
function chart(pts, { h = 170, fy = v => fmt(v, 1), label = 'Verlauf', goal = null } = {}) {
  if (pts.length < 2) return '<p class="muted small" style="margin:0">Ab zwei Einträgen erscheint hier der Verlauf.</p>';
  const W = 600, H = h, pl = 44, pr = 16, pt = 16, pb = 26;
  const ys = pts.map(p => p.y).concat(goal != null ? [goal] : []); let lo = Math.min(...ys), hi = Math.max(...ys);
  const raw = (hi - lo) / 3 || Math.max(1, Math.abs(hi) * .1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const X = i => pl + i * (W - pl - pr) / (pts.length - 1), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${esc(fy(v))}</text>`;
  if (goal != null) g += `<line class="goal" x1="${pl}" x2="${W - pr}" y1="${Y(goal)}" y2="${Y(goal)}"/><text class="ax" x="${pl + 4}" y="${Y(goal) - 5}">Ziel</text>`;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${line}L${X(pts.length - 1)},${Y(lo)}L${X(0)},${Y(lo)}Z`;
  const last = pts[pts.length - 1], lx = X(pts.length - 1), ly = Y(last.y);
  const dots = pts.length <= 24 ? pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${X(i)}" cy="${Y(p.y)}" r="2.5"/>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}
    <circle class="end" cx="${lx}" cy="${ly}" r="4.5"/><text class="lbl" x="${lx - 8}" y="${ly - 10}" text-anchor="end">${esc(fy(last.y))}</text>
    <text class="ax" x="${pl}" y="${H - 6}">${esc(pts[0].x)}</text><text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(last.x)}</text></svg>`;
}

function vMatch(m) {

  const cards = m.players.map((pid, pi) => {

      return `<div class="pl ${act ? 'act' : ''}"><span class="nm">${esc(pname(pid))}</span><span class="rem">${rem}</span>
        <span class="sub"><span>Legs ${won[pi]}</span><span>Ø ${fmt(stats[pi].avg, 1)}</span><span>${stats[pi].darts} D</span></span><span class="co">${co ? co.map(dLabel).join(' · ') : ''}</span></div>`;
    }
    const mk = cst.marks[pi];

// ---------- Ansichten: Training
function vPlan() {
  const p = S.plan, kurz = p.variant === 'kurz';
  const head = `<div class="bar"><span class="cap">Trainingsplan ${kurz ? 'kurz' : 'komplett'} · ${esc(pname(p.pid))} · ${Math.min(p.i + 1, p.steps.length)}/${p.steps.length}</span><button class="chip" data-act="planAbort">Beenden</button></div>

  if (p.i >= p.steps.length) {
    const ids = Object.keys(p.results), punkte = ids.reduce((a, k) => a + p.results[k].fe, 0), ziel = ids.reduce((a, k) => a + planGame(k).goal, 0);
    return `<section><span class="cap">Trainingsplan ${kurz ? 'kurz' : 'komplett'} · ${esc(pname(p.pid))}</span><h2>${fmt(ziel ? punkte / ziel * 100 : 0, 0)} % vom Ziel</h2>
      <div class="tbl"><table><thead><tr><th>Spiel</th><th class="r">Punkte</th><th class="r">Hochgerechnet</th><th class="r">Ziel</th></tr></thead><tbody>
      ${ids.map(k => { const g = planGame(k), r = p.results[k]; return `<tr><td>${esc(g.name)}</td><td class="n">${r.pts}${g.input === 'visit' || g.input === 'bo11' ? '' : ' / ' + r.played}</td><td class="n ${r.fe >= g.goal ? 'good' : ''}">${feFmt(r.fe)}</td><td class="n">${g.goal}</td></tr>` }).join('')}
      <tr><td><b>Summe</b></td><td></td><td class="n" style="color:var(--paper)">${feFmt(Math.round(punkte * 10) / 10)}</td><td class="n">${ziel}</td></tr></tbody></table></div>
      <p class="muted small" style="margin:0">Gespeichert. Die Entwicklung siehst du unter Statistik.</p>
      <button class="btn primary block" data-act="planClose">Fertig</button></section>`;
  }
  const step = p.steps[p.i];
  if (step === 'warm') {
    const min = kurz ? 3 : 10;
    return `<section>${head}<h2>Warm-Up</h2><p class="muted" style="margin:0">${min} Minuten warmspielen. Arm locker bekommen.</p>

  }

  const sum = p.cur.reduce((a, b) => a + b, 0);
  const goalNow = g.input === 'visit' || g.input === 'bo11' ? g.goal : Math.round(g.goal * N / g.rounds * 10) / 10;
  let big = '', btns = '';
  if (g.input === 'bo11') {
    const bo = p.bo || {};
    return `<section>${head}<h2>${esc(g.name)}</h2><p class="muted" style="margin:0">${esc(g.rule)}</p>
      <p class="muted small" style="margin:0">Spiel das Best of 11 (z. B. gegen den Computer) und trag danach das Ergebnis ein.</p>
      <div class="seg"><button class="${bo.win === true ? 'on' : ''}" data-act="planBo" data-v="1">Gewonnen</button><button class="${bo.win === false ? 'on' : ''}" data-act="planBo" data-v="0">Verloren</button></div>
      <label class="f">Dein Average<input type="text" id="boavg" inputmode="decimal" placeholder="z. B. 72,4" value="${bo.avg ?? ''}"></label>
      <button class="btn primary block big" data-act="planBoSave">Speichern</button><button class="link" data-act="planSkip">Spiel überspringen</button></section>`;

      <div class="tbig">${big}</div><p class="cap" style="text-align:center;margin:0">Ø nach ${n} von ${N} Aufnahmen · Ziel ${g.goal}${n ? ' · zuletzt ' + p.cur[n - 1] : ''}</p>

      <div class="quick">${[26, 41, 45, 60, 81, 85, 95, 100, 140, 180].map(v => `<button data-act="planQuick" data-v="${v}">${v}</button>`).join('')}</div>
      <div class="pad np">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-act="key" data-v="${k}">${k}</button>`).join('')}<button class="act" data-act="key" data-v="del">⌫</button><button data-act="key" data-v="0">0</button><button class="ok" data-act="planOk">OK</button></div>

  }

  return `<section>${head}<h2>${esc(g.name)}</h2><p class="muted" style="margin:0">${esc(g.rule)}</p>
    <p class="cap" style="margin:0;text-align:center">Runde ${n + 1} von ${N}</p><div class="tbig" style="font-size:${String(big).length > 6 ? 36 : 64}px">${esc(big)}</div>
    <p class="muted" style="text-align:center;margin:0"><span class="mono" style="color:var(--paper)">${sum}</span> Punkte · Ziel ${goalNow}</p>
    <div class="tbtns">${btns}</div>
    <div class="row"><button class="btn grow" data-act="planUndo" ${n ? '' : 'disabled'}>↶ Zurück</button><button class="btn grow" data-act="planSkip">Überspringen</button></div></section>`;
}

// ---------- Ansichten: Statistik
function vStats() {
  const ps = profiles();
  if (!ps.length) return `<section><h2>Statistik</h2><p class="muted">Sobald du unter „Spielen“ Spieler anlegst und spielst, erscheinen hier Averages, Checkout-Quote und dein Trainingsfortschritt.</p></section>`;
  if (!S.statPid || !Store.data.profiles[S.statPid]) S.statPid = ps[0].id;
  const pid = S.statPid, pr = Store.data.profiles[pid];
  if (S.statMatch) return vStatMatch();
  const ms = Store.list('matches').filter(m => m.players && m.players.includes(pid) && m.stats).sort((a, b) => a.date - b.date);
  const xs = ms.filter(m => m.type === 'x01'), cs = ms.filter(m => m.type === 'cricket');
  const me = m => m.stats.find(s => s.pid === pid) || {};
  const sum = k => xs.reduce((a, m) => a + (me(m)[k] || 0), 0);
  const pts = sum('pts'), darts = sum('darts'), f9p = sum('f9p'), f9d = sum('f9d');
  const wins = ms.filter(m => m.players[m.winner] === pid).length;
  const hi = Math.max(0, ...xs.map(m => me(m).hi || 0)), bests = xs.map(m => me(m).best).filter(x => x != null);
  const cMarks = cs.reduce((a, m) => a + (me(m).marks || 0), 0), cDarts = cs.reduce((a, m) => a + (me(m).darts || 0), 0);
  const groups = {}; Store.list('trainings').filter(t => t.pid === pid).forEach(t => { const k = t.mode + '|' + (t.variant || ''); (groups[k] = groups[k] || []).push(t) });
  const lp = pr.wdv && L ? L.byName[pr.wdv] : null;
  return `<section><h2>Statistik</h2><div class="chips">${ps.map(p => `<button class="chip ${p.id === pid ? 'on' : ''}" data-act="statPid" data-v="${p.id}">${esc(p.name)}</button>`).join('')}</div></section>
    <section><h3>X01 · ${xs.length} Spiele · ${wins} Siege gesamt</h3>
      <div class="kpis"><div class="kpi"><b>${fmt(darts ? pts / darts * 3 : null, 1)}</b><span>Ø 3 Darts</span></div><div class="kpi"><b>${fmt(f9d ? f9p / f9d * 3 : null, 1)}</b><span>First 9</span></div>
        <div class="kpi"><b>${sum('att') ? pct(sum('hit'), sum('att')) : '–'}</b><span>Checkout</span></div><div class="kpi"><b>${sum('s180')}</b><span>180er</span></div>
        <div class="kpi"><b>${sum('s140')}</b><span>140+</span></div><div class="kpi"><b>${hi || '–'}</b><span>High Finish</span></div><div class="kpi"><b>${bests.length ? Math.min(...bests) : '–'}</b><span>Bestes Leg</span></div>
        <div class="kpi"><b>${cs.length ? fmt(cDarts ? cMarks / cDarts * 3 : null, 2) : '–'}</b><span>Cricket MPR</span></div><div class="kpi"><b>${ms.length}</b><span>Spiele gesamt</span></div></div>
      <div class="card"><h3 style="margin-bottom:8px">Average pro Spiel</h3>${chart(xs.filter(m => me(m).avg != null).slice(-30).map(m => ({ x: dShort(m.date), y: me(m).avg })), { label: 'Average pro Spiel' })}</div></section>
    ${lp ? `<section><h3>Liga · ${esc(lp.name)}</h3><div class="kpis"><div class="kpi"><b>${fmt(lp.avg, 1)}</b><span>Ø Liga</span></div><div class="kpi"><b>${lp.singW}-${lp.sing - lp.singW}</b><span>Einzel</span></div><div class="kpi"><b>${lp.best ?? '–'}</b><span>Bestes Leg</span></div></div><button class="link" data-act="lplayerGo" data-v="${esc(lp.name)}">Liga-Verlauf ansehen →</button></section>` : ''}
    ${planSessions(pid).length ? `<section><h3>Trainingsplan</h3>${planCharts(pid)}</section>` : ''}
    <section><h3>Einzelne Übungen</h3>${Object.keys(groups).filter(k => TR[k.split('|')[0]]).length ? Object.entries(groups).map(([k, list]) => {
      list.sort((a, b) => a.date - b.date); const [mode, v] = k.split('|'), d = TR[mode]; if (!d) return '';
      const vals = list.map(x => x.metric), best = d.better === 'low' ? Math.min(...vals) : Math.max(...vals);
      const vn = v && d.variants ? (d.variants.find(x => x[0] === v) || [, v])[1] : '';
      return `<div class="card"><div class="bar"><span>${esc(d.name)}${vn ? ' · ' + esc(vn) : ''}</span><span class="cap">${list.length}× · Best ${trMetric(mode, best)} · zuletzt ${trMetric(mode, vals[vals.length - 1])}</span></div>
        ${chart(list.slice(-30).map(x => ({ x: dShort(x.date), y: x.metric })), { h: 140, label: d.name, fy: trFy(mode) })}</div>`;
    }).join('') : '<p class="muted small" style="margin:0">Noch keine Trainings gespeichert.</p>'}</section>
    <section><h3>Letzte Spiele</h3><div class="list">${ms.slice(-15).reverse().map(m => { const s = me(m), w = m.players[m.winner] === pid; return `<button class="li" data-act="statMatch" data-v="${m.id}"><span class="cap" style="width:40px">${dShort(m.date)}</span><span class="grow">${m.type === 'x01' ? m.start : 'Cricket'} vs. ${m.players.filter(x => x !== pid).map(x => esc(pname(x))).join(', ') || 'Solo'}</span><span class="pill ${w ? 'w' : 'l'}">${w ? 'S' : 'N'}</span><span class="score">${m.type === 'x01' ? fmt(s.avg, 1) : fmt(s.mpr, 2)}</span></button>` }).join('') || '<div class="li muted">Noch keine Spiele.</div>'}</div></section>
    <section><button class="link" data-act="manage">${S.manage ? 'Bearbeiten schließen' : 'Spieler bearbeiten'}</button>${S.manage ? vManage(pr, pid) : ''}</section>`;
}
function vManage(pr, pid) {
  const opts = L ? L.players.slice().sort((a, b) => (a.team === S.team) !== (b.team === S.team) ? (a.team === S.team ? -1 : 1) : a.name.localeCompare(b.name, 'de')) : [];
  return `<div class="card" style="display:flex;flex-direction:column;gap:12px"><label class="f">Name<div class="row"><input type="text" id="rename" class="grow" value="${esc(pr.name)}" maxlength="30"><button class="btn" data-act="rename" data-v="${pid}">Speichern</button></div></label>
    <label class="f">Mit WDV-Spieler verknüpfen<select id="wdvlink" data-chg="wdvlink" data-v="${pid}"><option value="">– keiner –</option>${opts.map(p => `<option value="${esc(p.name)}" ${pr.wdv === p.name ? 'selected' : ''}>${esc(p.name)} (${esc(p.team)})</option>`).join('')}</select></label>
    ${S.delAsk === pid ? `<div class="note warn row"><span class="grow">${esc(pr.name)} löschen? Gespeicherte Spiele bleiben erhalten.</span><button class="btn danger" data-act="delYes" data-v="${pid}">Löschen</button><button class="btn" data-act="delNo">Behalten</button></div>` : `<button class="btn danger" data-act="delAsk" data-v="${pid}">Spieler löschen</button>`}</div>`;
}
function vStatMatch() {
  const m = Store.data.matches[S.statMatch]; if (!m) { S.statMatch = null; return vStats() }
  const isX = m.type === 'x01';
  return `<section><button class="link" data-act="statMatchBack">← Zurück</button><span class="cap">${new Date(m.date).toLocaleString('de-AT', { dateStyle: 'medium', timeStyle: 'short' })}</span>
    <h2>${isX ? m.start : 'Cricket'} · First to ${m.legsToWin}</h2>
    <div class="tbl"><table><thead><tr><th>Spieler</th><th class="c">Legs</th>${isX ? '<th class="r">Ø</th><th class="r">First 9</th><th class="r">Checkout</th><th class="r">180</th><th class="r">High Finish</th><th class="r">Bestes Leg</th>' : '<th class="r">MPR</th>'}</tr></thead><tbody>
    ${m.stats.map((s, i) => `<tr class="${i === m.winner ? 'me' : ''}"><td>${esc(pname(s.pid))}</td><td class="c mono">${s.legsW}</td>${isX ? `<td class="n">${fmt(s.avg, 1)}</td><td class="n">${fmt(s.f9, 1)}</td><td class="n">${s.att ? pct(s.hit, s.att) : '–'}</td><td class="n">${s.s180}</td><td class="n">${s.hi || '–'}</td><td class="n">${s.best ?? '–'}</td>` : `<td class="n">${fmt(s.mpr, 2)}</td>`}</tr>`).join('')}
    </tbody></table></div>
    <button class="btn danger" data-act="delMatch" data-v="${m.id}">${S.delAsk === m.id ? 'Wirklich löschen? Nochmal tippen' : 'Spiel löschen'}</button></section>`;
}

// ---------- Ansicht: Einstellungen
function vSettings() {
  const st = { ok: 'Verbunden. Spiele und Trainings werden auf allen Geräten gespeichert.', offline: 'Gerade keine Verbindung. Alles wird lokal gesichert und später übertragen.', badkey: 'Der App-Schlüssel stimmt nicht.', nokey: 'Noch kein App-Schlüssel eingetragen. Bis dahin wird nur auf diesem Gerät gespeichert.', lokal: 'Verbinde …' }[Store.state];
  return `<section><button class="link" data-act="tab" data-t="liga">← Zurück</button><h2>Einstellungen</h2></section>
    <section><h3>Geräte verbinden</h3><div class="note ${Store.state === 'ok' ? '' : 'warn'}">${st}${Store.outbox.length ? ` (${Store.outbox.length} noch nicht übertragen)` : ''}</div>
      <label class="f">App-Schlüssel<div class="row"><input type="password" id="appkey" class="grow" value="${esc(Store.key)}" autocomplete="off" placeholder="Schlüssel eingeben"><button class="btn primary" data-act="saveKey">Verbinden</button></div></label>
      <p class="muted small" style="margin:0">Trag auf jedem Gerät denselben Schlüssel ein, dann siehst du überall dieselben Spieler, Spiele und Trainings.</p></section>
    <section><h3>Datensicherung</h3><p class="muted" style="margin:0">Speichert alle Spieler, Spiele und Trainings als Datei auf diesem Gerät. Mit „Sicherung einspielen“ holst du sie zurück. Vorhandenes bleibt dabei erhalten.</p>
      <div class="row"><button class="btn grow" data-act="exportData">Daten exportieren</button><label class="btn grow" style="text-align:center;cursor:pointer">Sicherung einspielen<input type="file" id="importfile" accept=".json,application/json" data-chg="import" hidden></label></div></section>
    <section><h3>Mein Team</h3><select id="myteam" data-chg="myteam">${(L ? L.teams : [{ name: S.team }]).map(t => `<option ${t.name === S.team ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select></section>
    <section><h3>Auf den Homescreen</h3><p class="muted" style="margin:0">iPhone: in Safari auf Teilen tippen, dann „Zum Home-Bildschirm“. Android: im Chrome-Menü „App installieren“ oder „Zum Startbildschirm hinzufügen“.</p></section>
    <section><h3>Liga-Daten</h3><p class="muted" style="margin:0">${L ? 'Stand ' + new Date(L.aktualisiert).toLocaleString('de-AT') + '. ' : ''}Werden täglich automatisch geholt, donnerstags und freitags zusätzlich abends. Mit dem Pfeil oben rechts jederzeit sofort.</p></section>`;
}

// ---------- Rendern
function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  const views = { liga: vLiga, spielen: vSpielen, training: vTraining, stats: vStats, settings: vSettings };
  $('#app').innerHTML = views[S.tab]();
  $('#stamp').innerHTML = L ? 'Liga-Stand<br>' + esc(new Date(L.aktualisiert).toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })) : '';
  $('#refreshBtn').classList.toggle('spin', S.refreshing);
}
function softRender() {
  const a = document.activeElement;
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT')) return;
  if ((S.tab === 'spielen' && S.live && !S.live.done) || (S.tab === 'training' && ((S.tr && !S.tr.done) || (S.plan && S.plan.i < S.plan.steps.length)))) return;
  render();
}
const A = {
  tab: d => { S.tab = d.t; if (d.t !== 'settings') LS.set('darts.tab', S.tab); S.report = null; S.lplayer = null; S.statMatch = null; window.scrollTo(0, 0) },
  refreshLiga: () => { refreshLiga() },
  liga: d => { S.liga = d.v; if (d.v === 'team') S.viewTeam = null },
  team: d => { S.liga = 'team'; S.viewTeam = d.v || null; S.report = null; S.lplayer = null; window.scrollTo(0, 0) },
  setTeam: d => { S.team = d.v; S.viewTeam = null; LS.set('darts.team', S.team); toast('Mein Team: ' + d.v) },
  round: d => S.round = +d.v,
  reportBy: d => { const s = L.spiele.find(x => x.heim + '|' + x.gast === d.v); if (s && s.bericht) { S.report = s.bericht; window.scrollTo(0, 0) } else toast('Für dieses Spiel gibt es noch keinen Spielbericht.') },
  rback: () => { S.report = null },
  lplayer: d => { S.lplayer = d.v; window.scrollTo(0, 0) },
  lplayerGo: d => { S.tab = 'liga'; S.lplayer = d.v; window.scrollTo(0, 0) },
  lback: () => { S.lplayer = null },
  lsort: d => S.lsort = d.v, lfilter: d => S.lfilter = d.v,
  togglePlayer: d => { const p = S.setup.players, i = p.indexOf(d.v); i >= 0 ? p.splice(i, 1) : p.push(d.v); LS.set('darts.setup', S.setup) },
  addProfile: () => { const el = $('#newp'), n = el.value.trim(); if (!n) return toast('Bitte einen Namen eingeben.'); if (profiles().some(p => p.name.toLowerCase() === n.toLowerCase())) return toast(n + ' gibt es schon.'); const id = uid(); Store.put('profiles', id, { name: n, created: Date.now() }); S.setup.players.push(id); LS.set('darts.setup', S.setup); toast(n + ' angelegt') },
  shuffle: () => { const p = S.setup.players; for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[p[i], p[j]] = [p[j], p[i]] } LS.set('darts.setup', S.setup) },
  mode: d => { S.setup.type = d.t; if (d.t === 'x01') S.setup.start = +d.s; LS.set('darts.setup', S.setup) },
  legs: d => { S.setup.legs = +d.v; LS.set('darts.setup', S.setup) },
  out: d => { S.setup.out = d.v; LS.set('darts.setup', S.setup) },
  input: d => { S.setup.input = d.v; LS.set('darts.setup', S.setup) },
  startMatch: () => { S.setup.players = S.setup.players.filter(id => Store.data.profiles[id]); if (!S.setup.players.length) return; S.live = newMatch(S.setup); S.mod = 'S'; S.entry = ''; S.abortAsk = false; saveLive(); window.scrollTo(0, 0) },
  mod: d => S.mod = S.mod === d.v && d.v !== 'S' ? 'S' : d.v,
  dart: d => { const m = S.live, n = +d.v; if (n === 25 && S.mod === 'T') return; (m.type === 'x01' ? x01Dart : crDart)(m, n === 0 ? 'M' : S.mod + n); S.mod = 'S' },
  undo: () => { undoMatch(S.live); S.entry = '' },
  toggleInput: () => { const m = S.live; if (m.pending.length) return toast('Erst die laufende Aufnahme beenden.'); m.input = m.input === 'dart' ? 'visit' : 'dart'; S.entry = ''; saveLive(); toast(m.input === 'dart' ? 'Eingabe pro Dart' : 'Eingabe pro Aufnahme') },
  key: d => { if (d.v === 'del') S.entry = S.entry.slice(0, -1); else if (S.entry.length < 3) S.entry = (S.entry + d.v).replace(/^0+(?=\d)/, '') },
  quick: d => { S.entry = d.v; A.visitOk() },
  visitOk: () => {
    const m = S.live, v = +S.entry || 0; S.entry = '';
    if (v > 180 || BAD_VISIT.includes(v)) return toast(v + ' ist mit 3 Darts nicht möglich.');
    const leg = curLeg(m), rem = remOf(m, leg, turnOf(m, leg));
    if (v === rem) {
      const ok = m.out === 'single' || (v <= 170 && !BOGEY.includes(v) && (m.out !== 'double' || checkout(v, 3)));
      if (!ok) { leg.visits.push({ p: turnOf(m, leg), darts: null, score: 0, bust: true, n: 3, att: 0, co: false }); toast(v + ' ist kein mögliches Finish – überworfen'); return saveLive() }
      let min = 3; if (m.out === 'double') { for (let k = 1; k <= 3; k++) if (checkout(v, k)) { min = k; break } } else min = v <= 60 ? 1 : v <= 120 ? 2 : 3;
      S.ask = { score: v, min }; return;
    }
    x01Visit(m, v, 3);
  },
  coDarts: d => { const v = S.ask.score; S.ask = null; x01Visit(S.live, v, +d.v) },
  coCancel: () => S.ask = null,
  abort: () => S.abortAsk = true, abortNo: () => S.abortAsk = false,
  abortYes: () => { S.live = null; S.abortAsk = false; LS.del('darts.live') },
  rematch: () => { const m = S.live; S.live = newMatch({ type: m.type, start: m.start, legs: m.legsToWin, out: m.out, input: m.input, players: [...m.players.slice(1), m.players[0]] }); saveLive() },
  newGame: () => { S.live = null; LS.del('darts.live') },
  fixLast: () => { const m = S.live; Store.del('matches', m.id); delete m.done; delete m.stats; m.winner = null; m.finishedAt = null; undoMatch(m) },
  trSel: d => { S.trSel = d.v; S.trVar = null }, trVar: d => S.trVar = d.v, trPid: d => S.trPid = d.v,
  trStart: () => { const def = TR[S.trSel]; S.tr = { id: uid(), mode: S.trSel, variant: def.variants ? S.trVar : null, pid: S.trPid, st: def.init(), log: [] }; S.entry = ''; saveTr(); window.scrollTo(0, 0) },
  trIn: d => trInput(S.tr, d.v),
  trQuick: d => { S.entry = d.v; A.trOk() },
  trOk: () => { const v = +S.entry || 0; S.entry = ''; if (v > 180 || BAD_VISIT.includes(v)) return toast(v + ' ist mit 3 Darts nicht möglich.'); trInput(S.tr, v) },
  trUndo: () => { const t = S.tr; if (t.log.length) { t.st = t.log.pop(); saveTr() } },
  trAbort: () => { S.tr = null; LS.del('darts.trlive') },
  trAgain: () => { const t = S.tr; S.tr = { id: uid(), mode: t.mode, variant: t.variant, pid: t.pid, st: TR[t.mode].init(), log: [] }; saveTr() },
  trClose: () => { S.tr = null; LS.del('darts.trlive') },
  planStart: d => { if (!S.trPid) return; S.plan = { id: uid(), variant: d.v, pid: S.trPid, date: Date.now(), steps: ['warm', ...PLAN.filter(g => d.v === 'voll' || g.short).map(g => g.id)], i: 0, cur: [], results: {}, warmEnd: null }; S.entry = ''; S.planAbortAsk = false; savePlan(); window.scrollTo(0, 0) },
  planWarm: d => { S.plan.warmEnd = Date.now() + d.v * 60000; savePlan() },
  planNext: () => { S.plan.i++; S.plan.cur = []; savePlan(); window.scrollTo(0, 0) },
  planIn: d => planInput(S.plan, +d.v),
  planQuick: d => { S.entry = d.v; A.planOk() },
  planOk: () => { const v = +S.entry || 0; S.entry = ''; if (v > 180 || BAD_VISIT.includes(v)) return toast(v + ' ist mit 3 Darts nicht möglich.'); planInput(S.plan, v) },
  planUndo: () => { S.plan.cur.pop(); savePlan() },
  planSkip: () => { S.plan.i++; S.plan.cur = []; S.plan.bo = null; savePlan(); window.scrollTo(0, 0) },
  planBo: d => { S.plan.bo = { ...(S.plan.bo || {}), win: d.v === '1', avg: ($('#boavg') || {}).value } ; savePlan() },
  planBoSave: () => { const p = S.plan, bo = p.bo || {}, avg = parseFloat(($('#boavg').value || '').replace(',', '.')); if (bo.win == null) return toast('Bitte Gewonnen oder Verloren wählen.'); if (isNaN(avg)) return toast('Bitte deinen Average eintragen.'); p.cur = [avg]; p.bo = null; planFinishGame(p, planGame('bo11'), bo11Pts(bo.win, avg)) },
  planAbort: () => S.planAbortAsk = true, planAbortNo: () => S.planAbortAsk = false,
  planAbortYes: () => { S.plan = null; S.planAbortAsk = false; LS.del('darts.plan') },
  planClose: () => { S.plan = null; LS.del('darts.plan') },
  statPid: d => { S.statPid = d.v; S.delAsk = null },
  statMatch: d => { S.statMatch = d.v; S.delAsk = null; window.scrollTo(0, 0) }, statMatchBack: () => S.statMatch = null,
  delMatch: d => { if (S.delAsk === d.v) { Store.del('matches', d.v); S.statMatch = null; S.delAsk = null; toast('Spiel gelöscht') } else S.delAsk = d.v },
  manage: () => { S.manage = !S.manage; S.delAsk = null },
  rename: d => { const n = $('#rename').value.trim(); if (!n) return; Store.put('profiles', d.v, { ...clone(Store.data.profiles[d.v]), name: n }); toast('Gespeichert') },
  delAsk: d => S.delAsk = d.v, delNo: () => S.delAsk = null,
  delYes: d => { Store.del('profiles', d.v); S.setup.players = S.setup.players.filter(x => x !== d.v); LS.set('darts.setup', S.setup); S.statPid = null; S.delAsk = null; toast('Spieler gelöscht') },
  exportData: () => {
    const data = { app: 'dirty-checkers-darts', exportiert: new Date().toISOString(), profiles: Store.data.profiles, matches: Store.data.matches, trainings: Store.data.trainings };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], { type: 'application/json' }));
    a.download = 'darts-sicherung-' + new Date().toISOString().slice(0, 10) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Sicherung gespeichert');
  },
  saveKey: () => { Store.key = $('#appkey').value.trim(); LS.set('darts.key', Store.key); Store.state = 'lokal'; Store.sync().then(() => { render(); toast(Store.state === 'ok' ? 'Verbunden' : Store.state === 'badkey' ? 'Schlüssel stimmt nicht' : 'Keine Verbindung') }) }
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = A[b.dataset.act]; if (!f) return;
  f(b.dataset, b, e); render();
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chg === 'wdvlink') { const pid = el.dataset.v; Store.put('profiles', pid, { ...clone(Store.data.profiles[pid]), wdv: el.value || null }); toast(el.value ? 'Verknüpft mit ' + el.value : 'Verknüpfung entfernt'); render() }
  if (el.dataset.chg === 'myteam') { A.setTeam({ v: el.value }); render() }
  if (el.dataset.chg === 'import' && el.files[0]) {
    el.files[0].text().then(t => {
      const d = JSON.parse(t); if (d.app !== 'dirty-checkers-darts') throw 0;
      let n = 0;
      COLS.forEach(c => Object.entries(d[c] || {}).forEach(([id, obj]) => { if (/^[\w-]{1,64}$/.test(id) && obj && typeof obj === 'object' && !Store.data[c][id]) { Store.put(c, id, obj); n++ } }));
      toast(n ? n + ' Einträge eingespielt' : 'Alles war schon vorhanden'); render();
    }).catch(() => toast('Das ist keine gültige Darts-Sicherung.'));
    el.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'newp' && e.key === 'Enter') { A.addProfile(); render() }
  if (e.target.id === 'appkey' && e.key === 'Enter') { A.saveKey() }
  const planVisit = S.tab === 'training' && S.plan && S.plan.i < S.plan.steps.length && (planGame(S.plan.steps[S.plan.i]) || {}).input === 'visit';
  const visitPad = planVisit || (S.tab === 'spielen' && S.live && !S.live.done && S.live.input === 'visit' && !S.ask) || (S.tab === 'training' && !S.plan && S.tr && !S.tr.done && S.tr.mode === 'scoring');
  if (!visitPad || e.target.tagName === 'INPUT') return;
  if (/^\d$/.test(e.key)) { A.key({ v: e.key }); render() }
  else if (e.key === 'Backspace') { A.key({ v: 'del' }); render() }
  else if (e.key === 'Enter') { (planVisit ? A.planOk : S.tab === 'spielen' ? A.visitOk : A.trOk)(); render() }
});
// Beim Zurückkehren in die App frische Daten holen (andere Geräte, neue Liga-Daten)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Store.sync(); loadLiga() } });
window.addEventListener('online', () => Store.sync());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
Store.init();
render();
loadLiga();
</script>
</body>
</html>
