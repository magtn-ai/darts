<style>
/* Layout: dunkles Terminal, eine kompakte Spalte, Tonstufen statt Schatten, Tab-Leiste unten */
:root{
  --void:#080809; --obsidian:#141415; --charcoal:#1b1d1f; --graphite:#26272d; --slate:#3c3d40; --iron:#34353c;
  --fog:#acadae; --paper:#ffffff; --ice:#83c3ff; --neg:#e24756;
  --ice-08:rgba(131,195,255,.08); --ice-20:rgba(131,195,255,.2); --neg-15:rgba(226,71,86,.16); --ring:inset 0 0 0 1px rgba(255,255,255,.08);
  --f-ui:Inter,"Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r-sm:4px; --r-lg:8px; color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--void)}
body{margin:0;background:var(--void);color:var(--paper);font-family:var(--f-ui);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(72px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--obsidian)}
html,body{overscroll-behavior-y:contain}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--obsidian);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ice);display:inline-block}
.stamp{font-family:var(--f-mono);font-size:12px;color:var(--fog);margin-left:auto;text-align:right;line-height:1.25}
.ibtn{width:36px;height:36px;border-radius:var(--r-sm);border:1px solid var(--iron);background:transparent;display:grid;place-items:center;flex:none}
.ibtn svg{width:18px;height:18px;fill:none;stroke:var(--paper);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;line-height:1.25}
h2{font-size:24px;letter-spacing:-.01em}
h3{font-size:12px;font-weight:500;color:var(--fog);text-transform:uppercase;letter-spacing:.08em}
main{display:flex;flex-direction:column;gap:32px;padding-block:16px 32px}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--fog)} .small{font-size:12px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.card{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:30px;border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:500;white-space:nowrap}
.chip.on{border-color:var(--ice);background:var(--ice-08);color:var(--paper)}
.seg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.seg::-webkit-scrollbar{display:none}
.seg button{height:30px;border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:0 10px;font-size:14px;font-weight:500;white-space:nowrap;color:var(--fog)}
.seg button.on{border-color:var(--ice);color:var(--paper);background:var(--ice-08)}
.btn{border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);padding:10px 16px;font-weight:500;font-size:14px}
.btn.primary{border-color:var(--ice)}
.btn.primary:hover{border-color:var(--paper)}
.btn.danger{border-color:var(--neg);color:var(--neg)}
.btn.block{width:100%}
.btn.big{padding:14px 16px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
input[type=text],input[type=password],select{height:40px;border:1px solid var(--iron);background:var(--charcoal);border-radius:var(--r-sm);padding:0 12px;min-width:0}
input::placeholder{color:var(--fog)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--fog)}
.link{border:0;background:none;color:var(--ice);font-weight:500;padding:0;align-self:flex-start;font-size:14px}
.tbl{overflow-x:auto;border-radius:var(--r-lg);background:var(--charcoal);box-shadow:var(--ring)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--iron)}
th{font-size:12px;color:var(--fog);font-weight:500}
td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
td.c,th.c{text-align:center} th.r{text-align:right}
tr:last-child td{border-bottom:0}
tr.me td{background:var(--ice-08)}
tr.me td:first-child{box-shadow:inset 2px 0 0 var(--ice)}
tr.tap{cursor:pointer}
tr.tap:hover td{background:rgba(60,61,64,.5)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--f-mono);font-size:20px;font-weight:500;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--fog)}
.pill{display:inline-grid;place-items:center;min-width:22px;height:20px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--f-mono)}
.pill.w{background:var(--ice-20);color:var(--ice)} .pill.l{background:var(--neg-15);color:var(--neg)} .pill.d{background:var(--graphite);color:var(--fog)}
.list{display:flex;flex-direction:column;background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:48px;border:0;border-bottom:1px solid var(--iron);background:none;width:100%;text-align:left;min-width:0}
.li:last-child{border-bottom:0}
button.li:hover{background:rgba(60,61,64,.5)}
.li.sel{box-shadow:inset 2px 0 0 var(--ice);background:var(--ice-08)}
.li .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .two{white-space:normal;padding-block:8px}
.score{font-family:var(--f-mono);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.next{background:var(--graphite);box-shadow:var(--ring);border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:4px}
.next .vs{font-size:20px;font-weight:500;line-height:1.25}
.cap{font-family:var(--f-mono);font-size:12px;color:var(--fog)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--iron);stroke-width:1}
.chart .ax{fill:var(--fog);font-size:12px;font-family:var(--f-mono)}
.chart .ln{fill:none;stroke:var(--ice);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--ice);opacity:.1}
.chart .pt{fill:var(--ice)} .chart .end{fill:var(--void);stroke:var(--ice);stroke-width:2.5}
.chart .goal{stroke:var(--fog);stroke-width:1;stroke-dasharray:4 4}
.chart .vl{fill:var(--fog);font-size:12px;font-family:var(--f-mono)}
.radar{max-width:480px;margin:0 auto;display:block}
.radar .ax{font-family:var(--f-ui);font-size:13px}
.radar .rval{fill:var(--paper);font-family:var(--f-mono)}
.radar .ar{opacity:.14}
.radar .rprev{fill:none;stroke:var(--fog);stroke-width:1.5;stroke-dasharray:3 3}
.radar .pt{stroke:var(--charcoal);stroke-width:2}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:12px;color:var(--fog);margin-top:6px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--ice)}
.legend .lg-prev{border-top:1.5px dashed var(--fog)}
.legend .lg-goal{border-top:1px dashed var(--fog)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rgrid .card{display:flex;flex-direction:column;gap:4px;font-size:13px}
.good{color:var(--ice)}
.chart .lbl{fill:var(--paper);font-size:13px;font-weight:500;font-family:var(--f-mono)}
.heat td.v{font-family:var(--f-mono);text-align:center;font-size:13px}
.h1{background:var(--neg-15)}.h2{background:var(--ice-08)}.h3{background:var(--ice-20);color:var(--paper)}
/* Scoreboard */
.board{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.pl{background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pl.act{box-shadow:inset 0 0 0 1px var(--ice);background:var(--graphite)}
.pl .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .rem{font-family:var(--f-mono);font-weight:500;font-size:52px;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.pl .sub{font-size:12px;color:var(--fog);display:flex;gap:10px;flex-wrap:wrap;font-family:var(--f-mono)}
.pl .co{font-family:var(--f-mono);font-size:13px;color:var(--ice);min-height:20px}
.cohint{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:var(--r-lg);background:var(--ice-08);box-shadow:inset 0 0 0 1px var(--ice)}
.cohint b{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--ice);letter-spacing:-.01em}
.darts{display:flex;gap:8px;min-height:34px}
.darts span{min-width:56px;text-align:center;border:1px dashed var(--iron);border-radius:var(--r-sm);padding:4px 6px;font-family:var(--f-mono);font-size:16px;font-weight:500}
.darts span.f{border-style:solid;background:var(--graphite)}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pad button{border:1px solid var(--iron);background:var(--charcoal);border-radius:var(--r-sm);height:52px;font-family:var(--f-mono);font-size:18px;font-weight:500}
.pad button:active{background:var(--slate)}
.pad .wide{grid-column:span 2}
.pad .mods{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad .mods button{font-family:var(--f-ui);font-size:15px;height:44px}
.pad .mods button.on{border-color:var(--paper);background:var(--slate)}
.pad .mods button.d.on{border-color:var(--ice);color:var(--ice);background:var(--ice-08)}
.pad .mods button.t.on{border-color:var(--neg);color:var(--neg);background:var(--neg-15)}
.pad .act{background:var(--graphite)}
.pad.np{grid-template-columns:repeat(3,1fr)}
.pad .ok{border-color:var(--ice);color:var(--ice)}
.entry{font-family:var(--f-mono);font-size:40px;font-weight:500;text-align:center;background:var(--charcoal);box-shadow:var(--ring);border-radius:var(--r-lg);padding:4px;min-height:60px;font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.quick button{border:1px solid var(--iron);background:transparent;border-radius:var(--r-sm);height:36px;font-family:var(--f-mono);font-size:14px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tbig{font-family:var(--f-mono);font-size:64px;font-weight:500;line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.tbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.tbtns button{height:64px;font-size:16px;font-weight:500;border-radius:var(--r-sm);border:1px solid var(--iron);background:var(--charcoal)}
.tbtns .hit{border-color:var(--ice);color:var(--ice);background:var(--ice-08)}
.tbtns .miss{background:var(--graphite);color:var(--fog)}
.tbtns button:active,.quick button:active,.btn:active{background:var(--slate)}
/* Tipp-Feedback: Rand leuchtet kurz in Ice auf */
.flash{animation:flash .45s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--ice),0 0 14px rgba(131,195,255,.45)}100%{box-shadow:0 0 0 2px transparent,0 0 0 transparent}}
/* Nach unten ziehen zum Aktualisieren */
#ptr{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:7;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:var(--graphite);box-shadow:var(--ring);display:grid;place-items:center;opacity:0;transform:translateY(-48px);pointer-events:none}
#ptr svg{width:18px;height:18px;fill:none;stroke:var(--fog);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#ptr.ready svg{stroke:var(--ice)}
#ptr.go{transition:transform .2s,opacity .2s}
#ptr.spin svg{animation:spin 1s linear infinite;stroke:var(--ice)}
.note{background:var(--graphite);box-shadow:var(--ring);border-radius:var(--r-lg);padding:10px 12px;font-size:14px}
.note.warn{box-shadow:inset 0 0 0 1px var(--neg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--obsidian);border-top:1px solid var(--iron);display:grid;grid-template-columns:repeat(4,1fr);padding:0 max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500;color:var(--fog);padding:8px 0;box-shadow:inset 0 2px 0 transparent}
nav.tabs button.on{color:var(--paper);box-shadow:inset 0 2px 0 var(--ice)}
nav.tabs button.on svg{stroke:var(--ice)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--graphite);box-shadow:var(--ring);color:var(--paper);padding:10px 14px;border-radius:var(--r-lg);font-size:14px;z-index:20;max-width:90vw}
.set{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--iron)}
.set:last-child{border-bottom:0}
.set .h{min-width:0}.set .g{text-align:right;min-width:0}
.legs{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.set .g .legs{justify-content:flex-end}
.legs i{font-style:normal;font-family:var(--f-mono);font-size:12px;padding:0 5px;border-radius:var(--r-sm);background:var(--graphite);color:var(--fog)}
.legs i.w{background:var(--ice-20);color:var(--ice)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<script>
// Adresse des Cloudflare-Helfers (wird beim Einrichten eingetragen)
const API = 'https://dirty-checkers-darts.magtnb.workers.dev';

// ---------- Helfer
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmt = (n, d = 1) => n == null || !isFinite(n) ? '–' : n.toFixed(d).replace('.', ',');
const pct = (a, b) => b ? fmt(a / b * 100, 0) + ' %' : '–';
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} },
  del(k) { try { localStorage.removeItem(k) } catch {} }
};
const clone = o => JSON.parse(JSON.stringify(o));
const pDate = s => { const [d, m, y] = s.split('.'); return new Date(+y, m - 1, +d) };
const dShort = ts => new Date(ts).toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit' });
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800) }

// ---------- Speicher: Spieler, Spiele, Trainings – lokal sofort, dann über den Helfer auf alle Geräte
const COLS = ['profiles', 'matches', 'trainings'];
const Store = {
  data: { profiles: {}, matches: {}, trainings: {} }, key: LS.get('darts.key', ''), state: 'lokal', outbox: LS.get('darts.outbox', []), flushing: false,
  init() { COLS.forEach(c => this.data[c] = LS.get('darts.' + c, {})); this.sync() },
  async sync() {
    if (!this.key) { this.state = 'nokey'; softRender(); return }
    try {

function chart(pts, { h = 170, fy = v => fmt(v, 1), label = 'Verlauf', goal = null } = {}) {
  if (pts.length < 2) return '<p class="muted small" style="margin:0">Ab zwei Einträgen erscheint hier der Verlauf.</p>';

  const raw = (hi - lo) / 3 || Math.max(1, Math.abs(hi) * .1);
  const mag = Math.pow(10, Math.floor(Math.log10(raw))); const step = [1, 2, 2.5, 5, 10].map(x => x * mag).find(x => x >= raw);
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step; if (hi === lo) hi = lo + step;
  const X = i => pl + i * (W - pl - pr) / (pts.length - 1), Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  let g = '';
  // "Ziel" steht links in der Achsenspalte; Achsenwerte zu nah daran fallen weg
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}"/>${gs && Math.abs(Y(v) - Y(gs[0])) < 12 ? '' : `<text class="ax" x="${pl - 6}" y="${Y(v) + 4}" text-anchor="end">${esc(fy(v))}</text>`}`;
  if (gs) {
    let d = `M${pl},${Y(gs[0])}`; for (let i = 1; i < gs.length; i++) if (gs[i] !== gs[i - 1]) { const x = (X(i - 1) + X(i)) / 2; d += `H${x}V${Y(gs[i])}` }
    g += `<path class="goal" fill="none" d="${d}H${W - pr}"/><text class="ax" x="${pl - 6}" y="${Y(gs[0]) + 4}" text-anchor="end">Ziel</text>`;
  }
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = `${line}L${X(pts.length - 1)},${Y(lo)}L${X(0)},${Y(lo)}Z`;
  const last = pts[pts.length - 1], lx = X(pts.length - 1), ly = Y(last.y);
  // Bis 15 Punkte steht an jedem Punkt der Wert, darüber nur am letzten (sonst wird es zu eng)
  const dots = pts.length <= 24 ? pts.slice(0, -1).map((p, i) => `<circle class="pt" cx="${X(i)}" cy="${Y(p.y)}" r="2.5"/>${pts.length <= 15 ? `<text class="vl" x="${X(i)}" y="${Y(p.y) - 9}" text-anchor="${i ? 'middle' : 'start'}">${esc(fy(p.y))}</text>` : ''}`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}
    <circle class="end" cx="${lx}" cy="${ly}" r="4.5"/><text class="lbl" x="${lx - 8}" y="${ly - 10}" text-anchor="end">${esc(fy(last.y))}</text>
    <text class="ax" x="${pl}" y="${H - 6}">${esc(pts[0].x)}</text><text class="ax" x="${W - pr}" y="${H - 6}" text-anchor="end">${esc(last.x)}</text></svg>`;
}

  let g = [50, 100, 150].map(v => `<polygon class="${v === 100 ? 'goal' : 'grid'}" fill="none" points="${poly(ax.map(() => v))}"/>`).join('');
  g += ax.map((_, i) => { const [x, y] = P(i, MAX); return `<line class="grid" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>` }).join('');
  const showPrev = ax.every(a => a.prev != null);
  const prev = showPrev ? `<polygon class="rprev" points="${poly(ax.map(a => a.prev))}"/>` : '';
  const cur = `<polygon class="ar" points="${poly(ax.map(a => a.cur))}"/><polygon class="ln" points="${poly(ax.map(a => a.cur))}"/>`;
  const dots = ax.map((a, i) => { const [x, y] = P(i, a.cur); return `<circle class="pt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="14" fill="transparent"><title>${esc(a.name)}: ${Math.round(a.cur)} % vom Ziel (${a.n} Einträge)</title></circle>` }).join('');
  const labels = ax.map((a, i) => {
    const [x, y] = P(i, MAX + 22), anc = x > cx + 8 ? 'start' : x < cx - 8 ? 'end' : 'middle', dy = y < cy - R ? -4 : y > cy + R ? 12 : 4;
    return `<text class="ax" x="${x.toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anc}">${esc(a.name)} <tspan class="rval">${Math.round(a.cur)}%</tspan></text>`;
  }).join('');
  return `<svg class="chart radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stärken und Schwächen in Prozent vom Ziel">${g}${prev}${cur}${dots}${labels}</svg>
    <div class="legend"><span><i class="lg-cur"></i>Aktuell (letzte 5)</span>${showPrev ? '<span><i class="lg-prev"></i>Die 5 davor</span>' : ''}<span><i class="lg-goal"></i>Ziel = 100 %</span></div>`;
}
function vRadar(pid) {
  const ax = radarData(pid);
  if (ax.length < 3) return `<section><h3>Stärken & Schwächen</h3><p class="muted small" style="margin:0">Sobald du in mindestens drei Bereichen trainiert hast (Trainingsplan, Doppel-Quote, Treble-Training, Spiele), erscheint hier dein Spinnennetz.</p></section>`;

    <div class="rgrid"><div class="card"><span class="cap">Stärken</span>${sorted.slice(0, k).map(a => `<div>${item(a)}</div>`).join('')}</div>

      ${sorted.map(a => `<tr><td>${esc(a.name)}</td><td class="n">${Math.round(a.cur)} %</td><td class="n">${a.prev != null ? Math.round(a.prev) + ' %' : '–'}</td><td class="n">${a.n}</td></tr>`).join('')}</tbody></table></div></details>

// ---------- Ansichten: Liga
function vLiga() {
  if (!L) return LIGA_ERR
    ? `<section><h2>Liga</h2><div class="note warn">Die Liga-Daten sind gerade nicht erreichbar. Prüfe die Internetverbindung und tippe oben auf Aktualisieren.</div></section>`

  if (S.report) return vReport();
  if (S.lplayer) return vLPlayer();
  const tabs = [['team', 'Mein Team'], ['tabelle', 'Tabelle'], ['runden', 'Spieltage'], ['spieler', 'Spieler'], ['teams', 'Teams']];
  const body = { team: () => vTeam(S.viewTeam || S.team), tabelle: vTabelle, runden: vRunden, spieler: vSpielerRang, teams: vTeams }[S.liga]();
  return `<section><div class="seg" role="tablist">${tabs.map(([k, l]) => `<button class="${S.liga === k ? 'on' : ''}" data-act="liga" data-v="${k}">${l}</button>`).join('')}</div></section>${body}
    <p class="muted small" style="margin:0">Quelle: wdv-dart.at, ${L.division}. Division, Saison ${esc(L.saison)}. Ø = 3-Dart-Average aus den Einzeln der Spielberichte.</p>`;
}
function vTeam(team) {
  const row = teamRow(team) || {}, info = teamInfo(team), today = new Date(); today.setHours(0, 0, 0, 0);
  const games = L.spiele.filter(s => s.heim === team || s.gast === team);
  const next = games.filter(s => s.setsH == null && pDate(s.datum) >= today).sort((a, b) => pDate(a.datum) - pDate(b.datum))[0];
  const done = games.filter(s => s.setsH != null).sort((a, b) => b.runde - a.runde);
  const players = teamPlayers(team);
  const rounds = [...new Set(done.map(s => s.runde))].sort((a, b) => a - b);
  let nx = '';
  if (next) {
    const home = next.heim === team, opp = home ? next.gast : next.heim, venue = teamInfo(next.heim), oRow = teamRow(opp) || {};
    nx = `<section><div class="next"><span class="cap">Nächstes Spiel · Runde ${next.runde} · ${esc(next.datum)}</span>
      <div class="vs">${home ? 'vs.' : '@'} ${esc(opp)}</div>

  }
  return `<section>${team !== S.team ? `<button class="link" data-act="team" data-v="">← Mein Team</button>` : ''}

    <p class="muted small" style="margin:0">${esc(info.verein || '')} · Heimspielort ${esc(info.spielort || '')}</p>
    <div class="kpis"><div class="kpi"><b>${row.platz || '–'}.</b><span>Platz</span></div><div class="kpi"><b>${row.g || 0}-${row.u || 0}-${row.v || 0}</b><span>S-U-N</span></div>
      <div class="kpi"><b>${fmt(row.setsG, 0)}:${row.setsV ?? '–'}</b><span>Sets</span></div></div></section>
    ${nx}

    <section><h3>Spieler</h3><div class="tbl"><table><thead><tr><th>Spieler</th><th class="r">Ø</th><th class="c">Einzel</th><th class="c">Legs</th><th class="c">Doppel</th><th class="r">Best</th><th class="r">180</th><th class="r">HiFi</th></tr></thead><tbody>
      ${players.map(p => `<tr class="tap" data-act="lplayer" data-v="${esc(p.name)}"><td>${esc(p.name)}</td><td class="n" style="color:var(--paper)">${fmt(p.avg, 1)}</td><td class="c mono">${p.singW}-${p.sing - p.singW}</td><td class="c mono">${p.legsW}-${p.legs - p.legsW}</td><td class="c mono">${p.dblW}-${p.dbl - p.dblW}</td><td class="n">${p.best ?? '–'}</td><td class="n">${p.s180 || '–'}</td><td class="n">${p.hifi ?? '–'}</td></tr>`).join('')}

    <div class="seg">${[['alle', 'Alle Teams'], ['team', 'Mein Team']].map(([k, l]) => `<button class="${S.lfilter === k ? 'on' : ''}" data-act="lfilter" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="tbl"><table><thead><tr><th class="c">#</th><th>Spieler</th><th class="r">Ø</th><th class="c">Legs</th><th class="r">Best</th><th class="r">180</th><th class="r">HiFi</th><th>Team</th></tr></thead><tbody>
    ${ps.map((p, i) => `<tr class="tap ${p.team === S.team ? 'me' : ''}" data-act="lplayer" data-v="${esc(p.name)}"><td class="c mono">${i + 1}</td><td>${esc(p.name)}</td><td class="n" style="color:var(--paper)">${fmt(p.avg, 1)}</td><td class="c mono">${p.legsW}-${p.legs - p.legsW}</td><td class="n">${p.best ?? '–'}</td><td class="n">${p.s180 || '–'}</td><td class="n">${p.hifi ?? '–'}</td><td class="muted">${esc(p.team)}</td></tr>`).join('')}

function vTeams() {

// ---------- Ansichten: Spielen

    ${st.type === 'x01' ? `<h3>Finish</h3><div class="seg">${[['double', 'Double Out'], ['single', 'Single Out'], ['master', 'Master Out']].map(([k, l]) => `<button class="${st.out === k ? 'on' : ''}" data-act="out" data-v="${k}">${l}</button>`).join('')}</div>
    <h3>Eingabe</h3><div class="seg">${[['dart', 'Pro Dart'], ['visit', 'Pro Aufnahme']].map(([k, l]) => `<button class="${st.input === k ? 'on' : ''}" data-act="input" data-v="${k}">${l}</button>`).join('')}</div>
    <p class="muted small" style="margin:0">Gilt für alle Spieler und lässt sich im Spiel jederzeit umschalten. Pro Dart liefert zusätzlich die Doppelquote.</p>` : '<p class="muted small" style="margin:0">Cricket wird pro Dart eingegeben.</p>'}</section>

function vMatch(m) {

    <span class="row">${isX ? `<button class="chip" data-act="toggleInput">${m.input === 'dart' ? 'Pro Dart' : 'Pro Aufnahme'} ⇄</button>` : ''}<button class="chip" data-act="abort">Beenden</button></span></div>
    ${S.abortAsk ? `<div class="note warn row"><span class="grow">Spiel ohne Speichern beenden?</span><button class="btn danger" data-act="abortYes">Beenden</button><button class="btn" data-act="abortNo">Weiter</button></div>` : ''}`;
  const cards = m.players.map((pid, pi) => {
    const act = pi === cur;

      const rem = remOf(m, leg, pi) - (act ? m.pending.reduce((a, d) => a + dartVal(d), 0) : 0);
      return `<div class="pl ${act ? 'act' : ''}"><span class="nm">${esc(pname(pid))}${pid === BOT ? ' · Ø ' + m.bot.avg : ''}</span><span class="rem">${rem}</span>
        <span class="sub"><span>Legs ${won[pi]}</span><span>${stats[pi].darts} D</span></span>
        <span class="sub" style="color:var(--paper)"><span>Leg Ø ${fmt(legAvgP(leg, pi), 1)}</span></span>
        <span class="sub" style="color:var(--paper)"><span>Gesamt Ø ${fmt(stats[pi].avg, 1)}</span></span></div>`;
    }
    const mk = cst.marks[pi];
    return `<div class="pl ${act ? 'act' : ''}"><span class="nm">${esc(pname(pid))}</span><span class="rem" style="font-size:40px">${cst.pts[pi]}</span>
      <span class="sub"><span>Legs ${won[pi]}</span><span>MPR ${fmt(stats[pi].mpr, 2)}</span></span>
      <span class="sub" style="color:var(--paper)">${[20, 19, 18, 17, 16, 15, 25].map(n => `<span>${n === 25 ? 'B' : n}:${mk[n] >= 3 ? '✓' : '/'.repeat(mk[n]) || '·'}</span>`).join('')}</span></div>`;
  }).join('');
  const last = [...leg.visits].reverse()[0];
  const lastTxt = last ? `${esc(pname(m.players[last.p]))}: ${last.bust ? 'überworfen' : isX ? last.score : last.darts.map(dLabel).join(' ')}` : 'Leg ' + m.legs.length + ' · ' + esc(pname(m.players[leg.starter])) + ' beginnt';
  let pad;

  const cMarks = cs.reduce((a, m) => a + (me(m).marks || 0), 0), cDarts = cs.reduce((a, m) => a + (me(m).darts || 0), 0);
  const groups = {}; Store.list('trainings').filter(t => t.pid === pid).forEach(t => { const k = t.mode + '|' + (t.variant || ''); (groups[k] = groups[k] || []).push(t) });
  const lp = pr.wdv && L ? L.byName[pr.wdv] : null;
  return `<section><h2>Statistik</h2><div class="chips">${ps.map(p => `<button class="chip ${p.id === pid ? 'on' : ''}" data-act="statPid" data-v="${p.id}">${esc(p.name)}</button>`).join('')}</div></section>

  const f = A[b.dataset.act]; if (!f) return;
  f(b.dataset, b, e); render();
  // Kurzes Aufleuchten am gedrückten Knopf (nach dem Neuzeichnen am gleichen Knopf)
  const sel = `[data-act="${b.dataset.act}"]` + (b.dataset.v != null ? `[data-v="${CSS.escape(b.dataset.v)}"]` : '');
  const nb = $('#app').querySelector(sel); if (nb) { nb.classList.remove('flash'); void nb.offsetWidth; nb.classList.add('flash') }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.chg === 'wdvlink') { const pid = el.dataset.v; Store.put('profiles', pid, { ...clone(Store.data.profiles[pid]), wdv: el.value || null }); toast(el.value ? 'Verknüpft mit ' + el.value : 'Verknüpfung entfernt'); render() }
  if (el.dataset.chg === 'myteam') { A.setTeam({ v: el.value }); render() }
  if (el.dataset.chg === 'import' && el.files[0]) {
    el.files[0].text().then(t => {
      const d = JSON.parse(t); if (d.app !== 'dirty-checkers-darts') throw 0;
      let n = 0;
      COLS.forEach(c => Object.entries(d[c] || {}).forEach(([id, obj]) => { if (/^[\w-]{1,64}$/.test(id) && obj && typeof obj === 'object' && !Store.data[c][id]) { Store.put(c, id, obj); n++ } }));
      toast(n ? n + ' Einträge eingespielt' : 'Alles war schon vorhanden'); render();
    }).catch(() => toast('Das ist keine gültige Darts-Sicherung.'));
    el.value = '';
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id === 'newp' && e.key === 'Enter') { A.addProfile(); render() }
  if (e.target.id === 'appkey' && e.key === 'Enter') { A.saveKey() }
  const planVisit = S.tab === 'training' && S.plan && S.plan.i < S.plan.steps.length && (planGame(S.plan.steps[S.plan.i]) || {}).input === 'visit';
  const visitPad = planVisit || (S.tab === 'spielen' && S.live && !S.live.done && S.live.input === 'visit' && !S.ask) || (S.tab === 'training' && !S.plan && S.tr && !S.tr.done && S.tr.mode === 'scoring');
  if (!visitPad || e.target.tagName === 'INPUT') return;
  if (/^\d$/.test(e.key)) { A.key({ v: e.key }); render() }
  else if (e.key === 'Backspace') { A.key({ v: 'del' }); render() }
  else if (e.key === 'Enter') { (planVisit ? A.planOk : S.tab === 'spielen' ? A.visitOk : A.trOk)(); render() }
});
// Beim Zurückkehren in die App frische Daten holen (andere Geräte, neue Liga-Daten)
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Store.sync(); loadLiga() } });
window.addEventListener('online', () => Store.sync());
// Am Laptop bleibt das Fenster oft offen: beim Zurückwechseln und jede Minute nachsehen, was andere Geräte gespeichert haben
let lastSync = 0;
const syncSoon = () => { if (document.visibilityState === 'visible' && Date.now() - lastSync > 15000) { lastSync = Date.now(); Store.sync() } };
window.addEventListener('focus', syncSoon);
setInterval(syncSoon, 60000);
// Ganz oben nach unten ziehen = wie der Pfeil oben rechts (Liga neu holen + Geräte abgleichen)
(() => {
  const el = $('#ptr'), MAX = 90, GO = 70; let y0 = null, dy = 0;
  const set = (d, cls) => { el.style.transform = `translateY(${d - 48}px) rotate(${d * 3}deg)`; el.style.opacity = Math.min(1, d / GO); el.classList.toggle('ready', d >= GO) };
  document.addEventListener('touchstart', e => { y0 = window.scrollY <= 0 && e.touches.length === 1 ? e.touches[0].clientY : null; dy = 0; el.classList.remove('go') }, { passive: true });
  document.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.min(MAX, Math.max(0, (e.touches[0].clientY - y0) * .5)); if (window.scrollY > 0) { y0 = null; dy = 0 } set(dy) }, { passive: true });
  document.addEventListener('touchend', () => {
    if (y0 == null) return; y0 = null; el.classList.add('go');
    if (dy >= GO) { set(GO); el.classList.add('spin'); A.refreshLiga(); render(); const wait = setInterval(() => { if (!S.refreshing) { clearInterval(wait); el.classList.remove('spin'); set(0) } }, 300) }
    else set(0);
    dy = 0;
  });
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
Store.init();
render();
loadLiga();
</script>
